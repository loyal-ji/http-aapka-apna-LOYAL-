d:#17254a;color:white}.btn.primary{background:linear-gradient(90deg,#00aeea,#6c45ff)}.btn:disabled{opacity:.45}.solution{margin-top:18px;padding:14px;border-radius:14px;background:#080e21;border:1px solid #25345a}.solution b{color:var(--good)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{padding:11px;border-radius:14px;background:#0b132c;border:1px solid #223154;text-align:center}.stat strong{display:block;font-size:18px}.hidden{display:none}.result h1{margin-top:0}.score{font-size:44px;font-weight:1000;color:var(--accent)}.rank{font-size:24px;font-weight:900}.notice{padding:12px;border-radius:12px;background:#151126;border:1px solid #4a356c;color:#ddd5ff;font-size:13px;margin:12px 0}.home{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.mini{font-size:12px;color:var(--muted)}@media(max-width:600px){.q{font-size:17px}.card{padding:14px}.stats{grid-template-columns:1fr 1fr 1fr}.option{padding:13px}}

const questions=[{"id":1,"question":"Consider the following statements with reference to the historical development of Fundamental Rights: (1) The Magna Carta, signed by the British King ‘John’ in 1215 AD, is the first written document related to fundamental rights. (2) In France, fundamental rights were granted to the public through the Declaration of the Rights of Man and of the Citizen in 1789 AD. (3) A detailed mention of fundamental rights was included in the original Constitution of America from the very beginning. Which of the statements given above is/are correct?","options":["1 and 2 only","2 and 3 only","3 only","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: कथन 3 गलत है क्योंकक अमेररका के मूल सोंकिधान में मौकलक अकधकारयों का उल्लेख नह ों था; इसे 1791 में अमेररक सोंकिधान में सोंशयधनयों द्वारा 'किल ऑफ राइट् स' के रूप में जयडा गया था।"},{"id":2,"question":"Consider the following statements regarding the history of the demand for Fundamental Rights in the Indian Constitution: (1) The demand for Fundamental Rights in India was made for the first time through the Constitution of India Bill, 1895. (2) Motilal Nehru put forward the demand for Fundamental Rights through the ‘Nehru Report’ in the year 1928 AD. (3) Fundamental Rights for Indians were included in the Government of India Act, 1935. Which of the statements given above is/are correct?","options":["1 and 3 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: भारत में सिवप्रथम मूल अकधकारयों क मााँ ग 1895 के सोंकिधान किधेयक द्वारा क गई और 1928 में नेहरू ररपयटव में भ इसे दयहराया गया। कथन 3 गलत है क्योंकक 1934 में सोंयुक्त सोंसद य सकमकत ने इस मााँग कय अस्व कार कर कदया था, कजसके कारण 1935 के भारत शासन अकधकनयम में इसे शाकमल नह ों ककया गया था।"},{"id":3,"question":"With reference to the definition of ‘State’ under Article 12 of the Indian Constitution, which of the following bodies are included within the ambit of ‘State’? (1) Government and Parliament of India (2) National Council of Educational Research and Training (NCERT) (3) Indian Statistical Institute (ISI) (4) Board of Control for Cricket in India (BCCI) Select the correct answer using the code given below:","options":["1 and 2 only","2, 3 and 4 only","1 and 3 only","1, 2, 3 and 4"],"answer":"c","explanation":"व्याख्या: अनुच्छेद 12 के तहत 'राज्य' शब्द में भारत सरकार, सोंसद, राज्य सरकारें , किधानमोंडल, स्थान य प्राकधकार तथा अन्य प्राकधकार शाकमल हैं । न्याकयक कनणवययों के अनुसार भारत य साों ख्यख्यक सोंगठन (ISO) राज्य है , जिकक NCERT और BCCI कय राज्य नह ों माना गया है ।"},{"id":4,"question":"Consider the following statements with reference to the ‘Doctrine of Eclipse’: (1) This doctrine primarily applies to preconstitutional laws that are inconsistent with fundamental rights. (2) Under this doctrine, laws inconsistent with fundamental rights do not become entirely dead or void ab initio from the beginning, but are rather overshadowed by fundamental rights. (3) The Supreme Court propounded this doctrine in the case of Bhikaji v. State of Madhya Pradesh (1955). Which of the statements given above are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"d","explanation":"व्याख्या: आच्छादन का कसद्ाों त अनुच्छेद 13(1) से सोंिोंकधत है , कजसके तहत सोंकिधान-पूिव किकधयााँ मूल अकधकारयों से असोंगत हयने पर सुषुप्तािस्था में चल जात हैं और आच्छादन हटते ह पुनजीकित हय जात हैं। भ खाज िनाम मध्य प्रदे श राज्य (1955) के मामले में सिोच्च न्यायालय द्वारा इस कसद्ाोंत का प्रकतपादन ककया गया था।"},{"id":5,"question":"Consider the following statements regarding the ‘Doctrine of Severability’: (1) This doctrine is related to the phrase ‘to the extent of the contravention’ used in Article 13(2). (2) If a part of an act is void, the court separates and declares only the void part invalid, rather than declaring the entire act void. (3) If the valid and void parts are so inextricably bound that separating them would defeat the primary objective of the act, then the entire act is declared invalid. Which of the statements given above is/are correct?","options":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"answer":"d","explanation":"व्याख्या: पृथक्करण यता का कसद्ाों त सोंकिधानेतर किकधययों पर लागू हयता है । इसका उद्दे श्य पूरे कानून कय कनरस्त करने के िजाय केिल उस कहस्से कय शून्य करना है जय मौकलक अकधकारयों का उल्लोंघन करता है , िशते कक िह कहस्सा शेष कानून से अलग ककए जाने ययग्य हय।"},{"id":6,"question":"Arrange the following landmark cases related to the Parliament’s power to amend Fundamental Rights in their correct chronological order: (1) Golaknath v. State of Punjab (2) Shankari Prasad v. Union of India (3) Kesavananda Bharati v. State of Kerala (4) Sajjan Singh v. State of Rajasthan Select the correct answer using the code given below:","options":["2-4-1-3","1-2-3-4","2-1-4-3","4-2-1-3"],"answer":"a","explanation":"व्याख्या: इन प्रकसद् िादयों का सह कालानुक्रकमक िषव इस प्रकार है : 1. शोंकर प्रसाद िनाम भारत सोंघ (1951) 2. सज्जन कसोंह िनाम राजस्थान राज्य (1965) 3. गयलकनाथ िनाम पोंजाि राज्य (1967) 4. केशिानोंद भारत िनाम केरल राज्य (1973) अतः सह कूट 2-4-1-3 है ।"},{"id":7,"question":"Consider the following statements: Statement I: No person in India can voluntarily waive their fundamental rights. Statement II: The majority of the population in India is poor and illiterate, lacking adequate political consciousness regarding their rights. With reference to the above statements, which one of the following is correct?","options":["Both Statement I and Statement II are correct and Statement II explains Statement I","Both Statement I and Statement II are correct but Statement II does not explain Statement I","Statement I is correct but Statement II is not correct","Statement I is not correct but Statement II is correct"],"answer":"a","explanation":"व्याख्या: भारत में 'अकधत्याग का कसद्ाों त' लागू नह ों हयता है । न्यायालय का मानना है कक अकशक्षा और गर ि के कारण लयग अपने स्वाथव के कलए अकधकारयों का दु रुपययग या त्याग कर सकते हैं , कजससे खतरनाक ख्यस्थकत उत्पन्न हय सकत है , अतः कथन II, कथन I का सह स्पष्ट करण है ।"},{"id":8,"question":"Consider the following statements with reference to ‘Equality before Law’ and ‘Equal Protection of Laws’ under Article 14: (1) The concept of ‘Equality before Law’ is derived from the British Constitution, which is a negative concept. (2) The concept of ‘Equal Protection of Laws’ is inspired by the American Constitution, which is a positive concept. (3) Article 14 completely prohibits class legislation but allows the State to make reasonable classification. Which of the statements given above are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"d","explanation":"व्याख्या: त नयों कथन सह हैं । 'किकध के समक्ष समता' का अथव है कक कयई भ कानून से ऊपर नह ों है । 'किकधययों के समान सोंरक्षण' का अथव है कक समान पररख्यस्थकतययों में कानून समान रूप से लागू हयगा। अनुच्छेद 14 मनमाने िगीकरण कय रयकता है लेककन ियधगम्य अोंतरक के आधार पर युख्यक्तयुक्त िगीकरण क अनुमकत दे ता है ।"},{"id":9,"question":"Consider the following statements regarding the prohibition of discrimination by the State against citizens under Article 15 of the Constitution: (1) Under Article 15(1), the State shall not discriminate against any citizen on grounds only of religion, race, caste, sex, place of birth or any of them. (2) The State can discriminate against a citizen on the ground of their ‘place of residence’ or ‘language’. (3) The fundamental rights conferred by Article 15 are available to foreign citizens as well along with the citizens of India. Which of the statements given above is/are correct?","options":["Only 1","Only 1 and 2","Only 2 and 3","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: कथन 1 और 2 सह हैं क्योंकक अनुच्छेद 15(1) में 'केिल' शब्द का प्रययग ककया गया है , कजसका तात्पयव है कक इन 5 आधारयों के अकतररक्त अन्य आधारयों (जैसे भाषा या कनिास स्थान) पर किभेद ककया जा सकता है । कथन 3 गलत है क्योंकक अनुच्छेद 15 केिल भारत य नागररकयों के कलए है , किदे कशययों के कलए नह ।ों"},{"id":10,"question":"Match the following lists: List-I (Constitutional Provision) List-II (Article) A. Special provisions for women and children Article 15(4) B. Reservation for socially and educationally backward classes Article 15(3) C. Reservation for admission to private educational institutions Article 15(6) D. Reservation for Economically Weaker Sections (EWS) Article 15(5) Select the correct answer based on the code given below: Code:","options":["A-2, B-1, C-4, D-3","A-1, B-2, C-3, D-4","A-2, B-4, C-1, D-3","A-3, B-1, C-4, D-2"],"answer":"a","explanation":"व्याख्या: सह सुमेलन इस प्रकार है : • ख्यिययों और िालकयों के कलए किशेष प्रािधान: अनुच्छेद 15(3) • सामाकजक और शैकक्षक दृकष्ट से कपछडे /SC/ST हे तु किशेष उपिोंध: अनुच्छेद 15(4) • कनज कशक्षण सोंस्थाओों में प्रिेश हे तु आरक्षण (93िााँ सोंशयधन): अनुच्छेद 15(5) • आकथवक रूप से कमजयर िगों (EWS) के कलए आरक्षण (103िााँ सोंशयधन): अनुच्छेद 15(6)"},{"id":11,"question":"Consider the following statements regarding the comparison between the Supreme Court and the High Court (Article 226) with reference to the power to issue writs under Article 32: (1) The scope of the High Court is wider than that of the Supreme Court in matters of writ jurisdiction. (2) The Supreme Court can issue writs only for the enforcement of fundamental rights, whereas the High Court can issue writs for the enforcement of fundamental rights as well as for other legal purposes. (3) Going to the High Court before approaching the Supreme Court under Article 32 is a mandatory legal procedure for an aggrieved person. Which of the statements given above is/are correct?","options":["1 and 2 only","2 and 3 only","1 only","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: कथन 1 और 2 किल्कुल सह हैं ; अनुच्छेद 226 के तहत उच्च न्यायालय का ररट क्षेत्राकधकार व्यापक हयता है । कथन 3 गलत है क्योंकक मूल अकधकारयों के प्रितवन के मामले में दयनयों न्यायालययों का क्षेत्राकधकार समिती है ; याकचकाकताव स धे सिोच्च न्यायालय जाने के कलए स्वतोंत्र है , उसके कलए पहले उच्च न्यायालय जाना आिश्यक नह ों है ।"},{"id":12,"question":"Consider the following statements regarding the exceptions to equality of opportunity in public employment under Article 16: (1) Parliament can prescribe ‘residence’ as a qualification for appointment to certain government services within a State by making a law. (2) The State can declare any class as a ‘backward class’ and reserve posts for it solely on economic grounds. (3) In the ‘Indra Sawhney v. Union of India’ case, the Supreme Court declared reservation in promotions to be invalid. Which of the statements given above are correct?","options":["Only 1 and 2","Only 2 and 3","Only 1 and 3","1, 2 and 3"],"answer":"c","explanation":"व्याख्या: कथन 1 अनुच्छेद 16(3) के अनुसार सह है । कथन 3 भ सह है क्योंकक मण्डल मामले (इन्द्रासाहन िाद) में न्यायालय ने माना था कक आरक्षण केिल शुरुआत कनयुख्यक्त में हयगा, प्रयन्नकत में नह ।ों कथन 2 गलत है क्योंकक न्यायालय के अनुसार कसफव आकथवक आधार कपछडा िगव के कनधाव रण क कसौट नह ों हय सकता, इसके कलए सामाकजक और शैक्षकणक कपछडापन अकनिायव है।"},{"id":13,"question":"With reference to the constitutional amendments made under Article 16(4-A) and 16(4-B), consider the following statements: (1) Article 16(4-A) was added by the 77th Constitutional Amendment (1995) to provide for reservation in promotion for SCs and STs. (2) Article 16(4-B) was added by the 81st Constitutional Amendment (2000) to recognize the ‘Rule of Carry Forward’. (3) While filling backlog vacancies, the violation of the maximum limit of 50% reservation will not be permissible. Which of the statements given above is/are correct?","options":["Only 1 and 2","Only 2 and 3","Only 1","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: कथन 1 और 2 किल्कुल सह हैं । कथन 3 गलत है क्योंकक अनुच्छेद 16(4-ख) के तहत िैकलाग (िकाया) आरकक्षत स्थानयों कय एक अलग िगव माना जाता है और उन्हें आगे के िषों में भरते समय 50% क अकधकतम स मा का िोंधन लागू नह ों हयता है ।"},{"id":14,"question":"Consider the following statements with reference to Article 17 and Article 18 of the Constitution: (1) The fundamental right conferred by Article 17 is available only against the action of the State, and not against private individuals. (2) In the ‘Balaji Raghavan v. Union of India’ case, the Supreme Court held that ‘Bharat Ratna’ and ‘Padma Awards’ are not titles within the meaning of Article 18(1). (3) The provisions of Article 18 are merely directory, and their violation is not a punishable offence unless the Parliament makes a law for this purpose. Which of the statements given above are correct?","options":["Only 1 and 2","Only 2 and 3","Only 1 and 3","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: कथन 1 गलत है क्योंकक 'प पुल्स यूकनयन फॉर डे मयक्रेकटक राइट् स' केस (1982) में सिोच्च न्यायालय ने स्पष्ट ककया था कक अनुच्छेद 17 का अकधकार राज्य के साथ-साथ प्राइिेट व्यख्यक्तययों के किरुद् भ उपलब्ध है । कथन 2 और 3 किल्कुल सह हैं , राष्टर य पुरस्कार 'सम्मान' हैं कजन्हें नाम के आगे -प छे प्रययग नह ों ककया जा सकता।"},{"id":15,"question":"Which of the following rights are included under the ‘Freedom of Speech and Expression’ guaranteed under Article 19(1)","options":["? (1) Freedom of the press (2) Right to hoist the national flag (3) Right to remain silent (4) Right to call for a strike and bandh Select the correct answer using the code given below:","1, 2 and 3 only","2, 3 and 4 only","1 and 3 only (d) 1, 2, 3 and 4"],"answer":"a","explanation":"व्याख्या: न्याकयक कनणवययों के अनुसार प्रेस क स्वतोंत्रता, राष्टर य ध्वज फहराना तथा चुप रहने का अकधकार िाक् एिों अकभव्यख्यक्त क स्वतोंत्रता का कहस्सा हैं । परों तु न्यायालय ने स्पष्ट ककया है कक 'हडताल एिों िोंद का अकधकार' अनुच्छेद 19(1)(क) के तहत कयई मूल अकधकार नह ों है ।"},{"id":16,"question":"Consider the following statements with reference to the protection granted to accused persons regarding conviction for offences under Article 20: (1) Under protection from ex-post facto laws, civil and tax laws cannot be applied with retrospective effect. (2) The principle of protection against double jeopardy is available only in proceedings before a court of law or a judicial tribunal, and not in departmental proceedings. (3) In the case of Selvi v. State of Karnataka (2010), the court declared narcotics, polygraph, and brain mapping tests of the accused as selfincrimination and prohibited them. Which of the statements given above are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: कथन 1 गलत है क्योंकक अनुच्छेद 20(1) केिल कायोत्तर 'दाख्यण्डक (Criminal) किकधययों' से सोंरक्षण प्रदान करता है ; कसकिल तथा कर सोंिोंध किकधयााँ भूतलक्ष प्रभाि से लागू क जा सकत हैं । कथन 2 और 3 किल्कुल सह हैं ।"},{"id":17,"question":"Consider the following statements: Statement I: After the ‘Maneka Gandhi vs. Union of India (1978)’ case, the right to life and personal liberty in the Indian Constitution provides protection against the executive as well as the legislature. Statement II: The Supreme Court interpreted in this case that the ‘procedure established by law’ prescribed under Article 21 must be just, fair and reasonable. With reference to the above statements, which one of the following is correct?","options":["Both Statement I and Statement II are correct and Statement II explains Statement I","Both Statement I and Statement II are correct but Statement II does not explain Statement I","Statement I is correct but Statement II is not correct","Statement I is not correct but Statement II is correct"],"answer":"a","explanation":"व्याख्या: ए.के. गयपालन िाद (1950) में न्यायालय ने कहा था कक अनुच्छेद 21 केिल कायवपाकलका के किरुद् सोंरक्षण दे ता है , किधाकयका के किरुद् नह ।ों परों तु मेनका गााँ ध िाद में इस कनणवय कय उलटते हुए 'किकध द्वारा स्थाकपत प्रकक्रया' कय प्राकृकतक न्याय के कसद्ाों तयों के अनुरूप (उकचत और ताककवक) हयना अकनिायव माना गया, कजससे यह किधाकयका के किरुद् भ सुरक्षा किच िन गया। अतः कथन और कारण दयनयों सह हैं और सह व्याख्या है ।"},{"id":18,"question":"Consider the following statements with reference to the rights of persons detained under preventive detention under Article 22: (1) A person arrested under preventive detention can generally be detained for a maximum period of three months only, without the permission of an Advisory Board. (2) It is mandatory to communicate the grounds of arrest to the arrested person as soon as possible. (3) According to the Constitution, the subject of ‘preventive detention’ falls exclusively under the Union List, on which only the Parliament can make laws. Which of the statements given above is/are correct?","options":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: कथन 1 और 2 कनिारक कनरयध के सोंिैधाकनक सुरक्षा उपाययों के तहत किल्कुल सह हैं । कथन 3 गलत है क्योंकक 'कनिारक कनरयध' का किषय सोंकिधान क समिती सूच (Concurrent List) में शाकमल है, कजसका अथव है कक केंद्र (सोंसद) और राज्य दयनयों इस पर कानून िना सकते हैं ।"},{"id":19,"question":"Consider the following statements regarding the Right against Exploitation (Articles 23 and 24): (1) Article 23(1) prohibits traffic in human beings, begar, and other similar forms of forced labor, and this protection is available against both the State and private individuals. (2) The State cannot impose compulsory service for public purposes because it falls under the category of begar. (3) Under Article 24, the employment of children below the age of 14 years in any factory, mine, or other hazardous employment is prohibited, which is an absolute right. Which of the statements given above is/are correct?","options":["1 and 2 only","1 and 3 only","3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: कथन 1 और 3 किल्कुल सह हैं ; अनुच्छेद 24 का कनषेध आत्योंकतक (कनरपेक्ष) है कजसका कयई अपिाद नह ों है । कथन 2 गलत है क्योंकक अनुच्छेद 23(2) इसका अपिाद है , जय राज्य कय सािवजकनक प्रययजनयों के कलए अकनिायव सेिा लागू करने क शख्यक्त दे ता है (िशते राज्य धमव , जाकत या िगव के आधार पर भेदभाि न करे )।"},{"id":20,"question":"Consider the following statements regarding the classification of Directive Principles of State Policy (DPSP): (1) Article 43B and 48 come under Gandhian principles. (2) Article 39A and 43A are part of Socialist principles. (3) Article 48A and 49 are classified under LiberalIntellectual principles. Which of the statements given above are correct?","options":["Only 1 and 2","Only 2 and 3","Only 1 and 3","1, 2 and 3"],"answer":"d","explanation":"व्याख्या: कदए गए सभ कथन सह हैं । भारत य सोंकिधान में न कत कनदे शक तत्यों का कयई औपचाररक िगीकरण नह ों है , लेककन उनक सामग्र और कदशा के आधार पर उन्हें त न व्यापक श्रेकणययों में िगीकृत ककया जाता है : • गाों ध िाद कसद्ाों त: इसके अोंतगवत अनुच्छेद 40, 43, 43B, 46, 47 और 48 शाकमल हैं । • समाजिाद कसद्ाों त: इसके अोंतगवत अनुच्छेद 38, 39, 39A, 41, 42, 43, 43A और 47 शाकमल हैं । (ध्यान दें कक कुछ अनुच्छेद जैसे 43 और 47 दयनयों में समान हैं )। • उदारिाद /िौख्यद्क कसद्ाों त: इसके अोंतगवत अनुच्छेद 44, 45, 48, 48A, 49, 50 और 51 शाकमल हैं ।"},{"id":21,"question":"Which of the following Directive Principles of State Policy was/were added by the 42nd Constitutional Amendment Act, 1976? (1) Participation of workers in the management of industries (Article 43A). (2) Promotion of co-operative societies (Article 43B). (3) Protection of environment and wildlife (Article 48A). (4) Minimizing inequalities in income, status, facilities and opportunities (Article 38(2)). Select the correct answer using the code given below:","options":["1 and 3 only","1, 2 and 3 only","2, 3 and 4 only","1 and 4 only"],"answer":"a","explanation":"व्याख्या: 42िें सोंकिधान सोंशयधन अकधकनयम, 1976 द्वारा भाग IV में चार नए तत् जयडे गए थे, कजनमें अनुच्छेद 39(f), अनुच्छेद 39A (कनः शुल्क किकधक सहायता), अनुच्छेद 43A (उद्ययगयों के प्रिोंधन में कमवचाररययों का भाग लेना) और अनुच्छेद 48A (पयाव िरण और िन्य ज ि सोंरक्षण) शाकमल हैं। • अनुच्छेद 43B कय 97िें सोंकिधान सोंशयधन अकधकनयम, 2011 द्वारा जयडा गया था (p. 1)। • अनुच्छेद 38(2) कय 44िें सोंकिधान सोंशयधन अकधकनयम, 1978 द्वारा जयडा गया था (p. 1)।"},{"id":22,"question":"In the context of the relationship between Fundamental Rights (FR) and Directive Principles of State Policy (DPSP), what is the correct chronological order of the following landmark cases? (1) Minerva Mills case (2) Golaknath case (3) Champakam Dorairajan case (4) Kesavananda Bharati case Select the correct answer using the code given below:","options":["3-2-4-1","3-4-2-1","2-3-1-4","2-1-3-4"],"answer":"a","explanation":"व्याख्या: मौकलक अकधकारयों और कनदे शक तत्यों के ि च सिोच्चता कय लेकर हुए कििादयों से जुडे िादयों का सह कालानुक्रकमक क्रम इस प्रकार है : 1. चोंपकम दयरायराजन िाद (1951): इसमें उच्चतम न्यायालय ने कनणवय कदया कक DPSP, मूल अकधकारयों के पूरक के रूप में लागू हयोंगे। 2. गयलकनाथ िाद (1967): न्यायालय ने कनणवय कदया कक सोंसद कय मूल अकधकारयों में सोंशयधन करने का अकधकार नह ों है । 3. केशिानोंद भारत िाद (1973): न्यायालय ने 25िें सोंशयधन क िैधता कय स्व कार ककया और न्याकयक सम क्षा कय िनाए रखा। 4. कमनिाव कमल्स िाद (1980): इस िाद से मौकलक अकधकारयों और कनदे शक तत्यों के ि च सामोंजस्यपूणव सोंरचना के कसद्ाों त क स्थापना हुई।"},{"id":23,"question":"Consider the following statements regarding the Uniform Civil Code (UCC): (1) Article 44 of the Constitution directs the State to secure a Uniform Civil Code for all citizens throughout the country. (2) Due to vast cultural diversity, framing a single personal law model is one of its major challenges. (3) It promotes vote-bank politics and provides more power to institutions like Khap Panchayats. Which of the statements given above are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: कथन 1 और 2 सह हैं । अनुच्छेद 44 के तहत पूरे दे श में सभ नागररकयों के कलए एक समान नागररक सोंकहता का प्रािधान है और भारत क व्यापक साों स्कृकतक किकिधता इसके कनमाव ण में एक िड चुनौत है। कथन 3 गलत है क्योंकक UCC के पक्ष में यह तकव कदया जाता है कक यह ियट िैंक क राजन कत कय कम करे गा और खाप पोंचायत जैसे अनौपचाररक कनकाययों क भूकमका कय कम करने में सहायक हयगा।"},{"id":24,"question":"With reference to the practical achievements and implementation of the Directive Principles of State Policy (DPSP), consider the following pairs: (1) Right to work — MNREGA Act, 2005 (2) Right to education — Right of Children to Free and Compulsory Education Act, 2009 (3) Environmental protection — Wild Life (Protection) Act, 1972 and Biological Diversity Act, 2002 How many of the above pairs are correctly matched?","options":["Only one","Only two","All three","None"],"answer":"c","explanation":"व्याख्या: सभ त नयों युग्म सह सुमेकलत हैं । यद्यकप DPSP गैर-प्रितवन य हैं , कफर भ सरकारयों ने इन्हें लागू करने के कलए कई कानून िनाए हैं • अनुच्छेद 41 (काम का अकधकार) कय लागू करने के कलए मनरे गा अकधकनयम, 2005 पाररत ककया गया। • अनुच्छेद 45 कय सोंशयकधत कर कशक्षा के अकधकार कय प्रभाि िनाने के कलए 2009 में अकधकनयम लाया गया। • अनुच्छेद 48A के तहत पयाव िरण क रक्षा के कलए िन्यज ि सोंरक्षण अकधकनयम, 1972 और जैि किकिधता अकधकनयम, 2002 िनाए गए।"},{"id":25,"question":"Consider the following statements with reference to the features and nature of the Directive Principles of State Policy (DPSP): (1) They are non-justiciable in nature, which means they are not legally enforceable by the courts. (2) They constitute a comprehensive program for establishing social and economic democracy in the country. (3) Lack of financial resources and widespread illiteracy in the country were the main reasons for making them non-enforceable at the time of their framing. Which of the statements given above are correct?","options":["Only 1 and 2","Only 2 and 3","Only 1 and 3","1, 2 and 3"],"answer":"d","explanation":"व्याख्या: कदए गए सभ कथन सह हैं । सोंकिधान के भाग IV (अनुच्छेद 36-51) में शाकमल DPSP गैर-न्याययकचत और गैर-प्रितवन य हैं । इनका मुख्य उद्दे श्य सामाकजक और आकथवक लयकतोंत्र क स्थापना कर एक लयक- कल्याणकार राज्य का कनमाव ण करना है । सोंकिधान कनमाव ण के समय भारत के पास कित्त य सों साधनयों क कम थ , कनरक्षरता अकधक थ और किकिध सामाकजक िगव मौजूद थे, कजसके कारण इन्हें तुरोंत कानून रूप से लागू करना सोंभि नह ों था और इन्हें गैर-प्रितवन य रखा गया।"},{"id":26,"question":"With reference to the relationship between the ‘Executive’ and the ‘Legislature’ in the Indian political system, consider the following statements: (1) In a parliamentary system of government, the executive is constitutionally completely independent of the legislature in terms of its tenure for its policies and actions. (2) In a presidential system of government, the principle of fusion of powers is adopted, whereas the parliamentary system is based on the separation of powers. (3) In India, a parliamentary democracy and a republic have been established simultaneously because the post of the Head of State is not hereditary but elected. Which of the statement/s given above is/are correct?","options":["Only 1 and 2","Only 3","Only 2 and 3","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: • कथन 1 गलत है : सोंसद य व्यिस्था में कायवपाकलका अपने कायों के कलए किधाकयका के प्रकत उत्तरदाय हयत है और उसका कायवकाल सोंसद के किश्वास पर कनभवर करता है । कायवकाल के मामले में किधाकयका से स्वतोंत्र हयना अध्यक्षात्मक व्यिस्था (जैसे अमेररका) क किशेषता है । • कथन 2 गलत है : अध्यक्षात्मक व्यिस्था 'शख्यक्तययों के पृथक्करण' पर आधाररत हयत है , जिकक सोंसद य व्यिस्था में कायवपाकलका और किधाकयका के मध्य शख्यक्तययों का सख्यम्मश्रण और सामोंजस्य हयता है । • कथन 3 सह है : भारत ने किटे न क तरह सोंसद य प्रणाल अपनाई है , लेककन किकटश सम्राट का पद िोंशानुगत है जिकक भारत का राष्टरपकत कनिाव कचत हयता है , जय भारत कय एक गणराज्य िनाता है ।"},{"id":27,"question":"Consider the following statements regarding the election and process of election of the President of India: (1) The electoral college of the President includes the nominated members of both Houses of Parliament and the elected members of the legislative councils of the states. (2) The 84th Constitutional Amendment Act mandates that until the relevant figures for the first census taken after the year 2026 have been published, the population of the states shall be based on the 1971 census. (3) If the legislative assembly of a state is dissolved at the time of the election of the President, the election can be postponed on the ground that the electoral college is incomplete. Which of the statements given above is/are correct?","options":["1 and 2 only","2 only","1 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: • कथन 1 गलत है : सोंसद के मनयन त सदस्य और राज्ययों क किधान पररषदयों के सदस्य राष्टरपकत के चुनाि में भाग नह ों लेते हैं । • कथन 2 सह है : 84िें सोंकिधान सोंशयधन अकधकनयम (2001) द्वारा यह प्रािधान ककया गया है कक िषव 2026 के िाद हयने िाल पहल जनगणना के आों कडे आने तक राष्टरपकत चुनाि के कलए 1971 क जनगणना कय ह आधार माना जाएगा। • कथन 3 गलत है : 11िें सोंकिधान सोंशयधन अकधकनयम 1961 (अनुच्छेद 71(4)) के अनुसार, कनिाव चक मोंडल में ककस पद क ररक्तता या ककस राज्य क किधानसभा भोंग हयने के आधार पर राष्टरपकत के चुनाि कय अिैध घयकषत या स्थकगत नह ों ककया जा सकता।"},{"id":28,"question":"With reference to the impeachment of the President of India, which of the following statements is correct?","options":["The motion of impeachment can be introduced only in the Lok Sabha and it is mandatory to give 7 days’ advance notice to the President.","The elected members of the State Legislative Assemblies, who voted in his election, participate in the process of impeachment of the President.","The nominated members of both the Houses of Parliament, who do not participate in the election of the President, participate in the quasi-judicial process of impeachment.","If the motion of impeachment is passed by the first House by a simple majority, the President is automatically deemed to have been vacated from office."],"answer":"c","explanation":"व्याख्या: • अनुच्छेद 61 के तहत महाकभययग सोंसद द्वारा चलाई जाने िाल एक अद्व -न्याकयक प्रकक्रया है । • इस प्रकक्रया में सोंसद के दयनयों सदनयों के मनयन त सदस्य भाग लेते हैं , भले ह उन्हयोंने राष्टरपकत के चुनाि में भाग न कलया हय। • इसके किपर त, राज्ययों तथा कदल्ल ि पुदुचेर क किधानसभाओों के कनिाव कचत सदस्य महाकभययग में भाग नह ों लेते हैं , भले ह िे चुनाि में ियट डालते हैं । • महाकभययग का प्रस्ताि ककस भ सदन में लाया जा सकता है (14 कदन पूिव सूचना के साथ) और इसे दयनयों सदनयों द्वारा अलग-अलग अपन कुल सदस्य सोंख्या के कम से कम दय-कतहाई (2/3) िहुमत से पाररत हयना आिश्यक है ।"},{"id":29,"question":"Consider the following statements regarding the Veto powers of the President: (1) Absolute Veto is generally exercised on private members’ bills or on government bills in a situation when the cabinet resigns. (2) Under Suspensive Veto, the President can return Money Bills and Constitutional Amendment Bills to the Parliament for reconsideration. (3) While exercising Pocket Veto, no time limit has been prescribed by the Constitution for the President to give or withhold assent to a bill. Which of the statements given above are correct?","options":["Only 1 and 2","Only 2 and 3","Only 1 and 3","1, 2 and 3"],"answer":"c","explanation":"व्याख्या: • कथन 1 सह है : आत्याों कतक ि टय के तहत किधेयक का अख्यस्तत् समाप्त हय जाता है . इसका प्रययग मुख्यतः गैर-सरकार किधेयकयों या नई सरकार क कसफाररश पर पुरान सरकार के किधेयकयों पर हयता है । • कथन 2 गलत है : धन किधेयकयों के मामले में राष्टरपकत कनलम्बनकार ि टय का प्रययग नह ों कर सकता, िह इसे पुनकिवचार के कलए नह ों भेज सकता; साथ ह , 24िें सोंशयधन 1971 के िाद सोंकिधान सोंशयधन किधेयकयों पर ि टय का अकधकार नह ों है । • कथन 3 सह है : भारत य सोंकिधान में राष्टरपकत के कलए किधेयक पर कनणवय लेने क कयई समय-स मा तय नह ों है (अमेररका के किपर त जहााँ 10 कदन क स मा है ), इसकलए भारत का राष्टरपकत 'जेि ि टय' का प्रययग कर किधेयक कय अकनकितकाल के कलए लोंकित रख सकता है ।"},{"id":30,"question":"With reference to the President’s power to promulgate ordinances (Article 123), consider the following statements: (1) The President’s power to promulgate an ordinance is a discretionary power, which he exercises independently during emergency situations. (2) Even if only one House of Parliament is in session, an ordinance can be promulgated by the President, as a single House is not competent to pass a law. (3) By the 44th Constitutional Amendment Act, the provision was restored that the President’s satisfaction in promulgating an ordinance can be subjected to judicial review. Which of the statements given above is/are correct?","options":["1 and 2 only","2 and 3 only","3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: • कथन 1 गलत है : राष्टरपकत क अध्यादे श जार करने क शख्यक्त स्वकििेक य नह ों है ; िह इसका प्रययग केिल केंद्र य मोंकत्रमोंडल क सलाह पर ह करता है । • कथन 2 सह है : यकद सोंसद का केिल एक सदन सत्र में चल रहा हय, ति भ अध्यादे श जार हय सकता है , क्योंकक कयई भ कानून पाररत करने के कलए दयनयों सदनयों का सत्र में हयना आिश्यक है । • कथन 3 सह है : 38िें सोंशयधन (1975) ने अध्यादे श कय न्याकयक सम क्षा से िाहर ककया था, परों तु 44िें सोंकिधान सोंशयधन (1978) द्वारा इसे कनरकसत कर कदया गया, कजससे कूपर केस (1970) के अनुसार अध्यादे श क असद्भाि के आधार पर न्याकयक सम क्षा सोंभि है ।"},{"id":31,"question":"Consider the following pairs of the six freedoms guaranteed to citizens under Article 19 and the fields of restrictions/characteristics applicable to them: Type of Freedom Field of Restriction/ Characteristic 1. Right to assemble peaceably and without arms Exercised only on public land, does not include the right to strike 2. Right to move freely throughout the territory of India Internal movement (Article 19) and external movement (Article 21) 3. Right to reside and settle in any part of the territory of India Can be restricted for the protection of the interests of any Scheduled Tribe How many of the above pairs are correctly matched?","options":["Only one pair","Only two pairs","All three pairs","None of the pairs"],"answer":"c","explanation":"व्याख्या: सभा करने का अकधकार केिल सािवजकनक भूकम पर शाों कतपूणव और किना हकथयारयों के ह िैध है , और इसमें 'हडताल' करने का अकधकार शाकमल नह ों है । अतः युग्म 1 सह है । आिागमन क स्वतोंत्रता के दय आयाम हैं ; दे श के अोंदर घूमना अनुच्छेद 19 के तहत आता है और दे श से िाहर जाना तथा िापस आना अनुच्छेद 21 के तहत आता है । अतः युग्म 2 सह है । जनजात य क्षेत्रयों के किकशष्ट तौर-तर कयों, सोंस्कृकत और सोंपकत्त कय िाहर शयषण से िचाने के कलए िहाों िाहर लयगयों के िसने पर प्रकतिोंध लगाया जा सकता है । अतः युग्म 3 भ सह है । सभ त न युग्म सह सुमेकलत हयने के कारण किकल्प (c) सह है ।"},{"id":32,"question":"Consider the following statements regarding the comparative study of the pardoning powers of the President and the Governor (Article 72 and Article 161): (1) The President has the power to grant pardon in cases of punishment awarded by a Court Martial (Military Court), whereas the Governor does not possess this power. (2) The Governor can commute or remit a sentence of death, but he cannot completely pardon a death sentence. (3) According to the Supreme Court’s judgement in the ‘Epuru vs. State of Andhra Pradesh (2006)’ case, the pardoning powers of the President and the Governor are not subject to judicial review. Which of the statements given above is/are correct?","options":["Only 1 and 2","Only 2 and 3","Only 1","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: • कथन 1 सह है : सैन्य अदालत के मामलयों में क्षमादान दे ने का अकधकार केिल दे श के राष्टरपकत कय है , राज्ययों के राज्यपालयों कय नह ।ों • कथन 2 सह है : राज्यपाल मृत्युदोंड क सजा कय स्थकगत, कम या िदल (लघुकरण/पररहार) सकता है , लेककन मृत्युदोंड कय 'पूणवतः क्षमा' (दयषमुक्त) करने क शख्यक्त केिल राष्टरपकत के पास है । • कथन 3 गलत है : इपुरू िनाम आों ध्र प्रदे श (2006) मामले में सुप्र म कयटव ने स्पष्ट ककया था कक क्षमादान क शख्यक्त का पुनकिवलयकन (Judicial Review) ककया जा सकता है , यकद िह कनणवय राजन कतक, धाकमवक या जाकतगत कारणयों से प्रेररत हय।"},{"id":33,"question":"With reference to the Union Council of Ministers and its responsibility, consider the following statements: (1) According to Article 75(3) of the Constitution, the Council of Ministers is collectively responsible to both Houses of Parliament (Lok Sabha and Rajya Sabha). (2) According to the principle of collective responsibility, if the Council of Ministers takes a decision by majority, it is mandatory for all ministers to support it both inside and outside the Parliament, failing which they must resign. (3) The members of the Council of Ministers are individually responsible to the Prime Minister and they hold office during the pleasure of the Prime Minister. Which of the statement(s) given above is/are correct?","options":["1 and 3 only","2 only","1 and 2 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: • कथन 1 गलत है : अनुच्छेद 75(3) के तहत मोंकत्रपररषद सामूकहक रूप से केिल लयक सभा के प्रकत उत्तरदाय हयत है , सोंसद के दयनयों सदनयों के प्रकत नह ।ों • कथन 2 सह है : सामूकहक उत्तरदाकयत् के अनुसार मोंकत्रपररषद एक इकाई के रूप में कायव करत है । यकद कयई मोंत्र सरकार के फैसले से असहमत है , तय उसे पद छयडना पडता है (जैसे 1950 में डॉ. श्यामा प्रसाद मुखजी ने मतभेद के कारण त्यागपत्र कदया था)। • कथन 3 गलत है : अनुच्छेद 75(2) के अनुसार, मोंत्र व्यख्यक्तगत रूप से राष्टरपकत के प्रसादपयवन्त पद धारण करते हैं , न कक प्रधानमोंत्र के। हालाों कक राष्टरपकत प्रधानमोंत्र क सलाह पर ह ककस मोंत्र कय हटाता है ।"},{"id":34,"question":"Consider the following statements regarding the Prime Minister of India and the administrative structure of the Central Secretariat: (1) The Cabinet Secretariat functions directly under the administrative control of the VicePresident of India. (2) The Cabinet Secretary is the ex-officio Chairman of the Civil Services Board and is the highestranking civilian officer of the Government of India. (3) The Prime Minister’s Office (PMO), which came into existence in its current form in 1977, is always administratively headed by the Cabinet Secretary. Which of the statements given above is/are correct?","options":["1 and 2 only","2 only","2 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: • कथन 1 गलत है : मोंकत्रमण्डल य सकचिालय प्रत्यक्ष रूप से प्रधानमोंत्र के अध न कायव करता है , उपराष्टरपकत के नह ।ों • कथन 2 सह है : कैकिनेट सकचि दे श का सिोच्च कसकिकलयन अकधकार हयता है और िह कसकिल सकिवसेज ियडव का पदे न अध्यक्ष भ हयता है । • कथन 3 गलत है : प्रधानमोंत्र कायाव लय (PMO) का नाम 1977 में िदला गया था, लेककन इसका प्रमुख कैकिनेट सकचि नह ों हयता, िख्यल्क प्रधानमोंत्र के 'प्रधान सकचि' इसके प्रशासकनक प्रमुख हयते हैं ।"},{"id":35,"question":"Consider the following statements with reference to the Attorney General of India: (1) The qualifications required for the appointment of the Attorney General must be the same as those necessary for the appointment of a judge of the Supreme Court. (2) Under Article 88, he has the right to take part in the proceedings of both Houses of Parliament and any committee of Parliament. (3) He is a full-time counsel for the Government and, falling under the category of a government servant, is debarred from private legal practice. Which of the statement(s) given above is/are correct?","options":["Only 1","Only 1 and 2","Only 2 and 3","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: • कथन 1 सह है : अनुच्छेद 76(1) के अनुसार, राष्टरपकत केिल उस व्यख्यक्त कय महान्यायिाद कनयुक्त कर सकता है जय सिोच्च न्यायालय का न्यायाध श िनने क ययग्यता रखता हय। • कथन 2 सह है : महान्यायिाद कय सोंसद के सदनयों और सकमकतययों में ियलने तथा भाग लेने का अकधकार तय है , लेककन अनुच्छेद 88 के तहत उसे मतदान (ियट दे ने) का अकधकार नह ों है , क्योंकक िह सोंसद का सदस्य नह ों हयता। • कथन 3 गलत है : महान्यायिाद न तय सरकार का पूणवकाकलक िक ल हयता है और न ह िह सरकार कमवचार क श्रेण में आता है। इसकलए उसे कनज प्रैख्यिस से रयका नह ों गया है , िशते िह भारत सरकार के ख्यखलाफ कयई मामला न लडे ।"},{"id":36,"question":"With reference to the Attorney General, which of the following statements is not correct?","options":["He can speak and take part in the proceedings of both Houses of Parliament, despite not being a member of Parliament.","He has the right to vote in the proceedings of Parliament.","He holds office during the pleasure of the President.","He has the right of audience in all courts within the territory of India."],"answer":"b","explanation":"व्याख्या: अनुच्छेद 88 के तहत महान्यायिाद कय सोंसद के दयनयों सदनयों क िैठक या सोंयुक्त िैठक में भाग लेने और ियलने का पूरा अकधकार है , परों तु चूोंकक िह सोंसद का सदस्य नह ों हयता, इसकलए िह सोंसद में मतदान (ियट) नह ों कर सकता ।"},{"id":37,"question":"The executive power of the Union shall be vested in the President and shall be exercised by him either directly or through officers subordinate to him in accordance with this Constitution. In which Article is this described?","options":["Article 53 (1)","Article 74 (1)","Article 75 (2)","Article 56 (1)"],"answer":"a","explanation":"व्याख्या: अनुच्छेद 53(1) के अनुसार सोंघ क समस्त कायवपाकलका शख्यक्त राष्टरपकत में कनकहत हयत है । यहााँ 'अध नस्थ अकधकाररययों' से तात्पयव केंद्र य मोंकत्रपररषद से है ।"},{"id":38,"question":"Which Constitutional Amendment Act provided that the 1971 census would remain the basis for the Presidential election until the relevant figures for the first census taken after the year 2026 have been published?","options":["82nd Constitutional Amendment","83rd Constitutional Amendment","84th Constitutional Amendment","91st Constitutional Amendment"],"answer":"c","explanation":"व्याख्या: 84िें सोंकिधान सोंशयधन अकधकनयम (2001) द्वारा यह व्यिस्था द गई है कक जि तक िषव 2026 के पिात हयने िाल प्रथम जनगणना के आों कडे सामने नह ों आते , ति तक राष्टरपकत चुनाि के कलए राज्ययों क जनसोंख्या का आधार 1971 क जनगणना कय ह माना जाएगा।"},{"id":39,"question":"The format of the oath of the President is given in which Schedule or Article of the Constitution?","options":["In Schedule-3","In Schedule-2","In Article 60","In Article 61"],"answer":"c","explanation":"व्याख्या: सामान्यतः मोंकत्रययों और पदाकधकाररययों क शपथ अनुसूच -3 में हयत है , लेककन राष्टरपकत के शपथ का किकशष्ट प्रारूप स धे सोंकिधान के अनुच्छेद 60 में ह कदया गया है , अनुसूच -3 में नह ।ों"},{"id":40,"question":"Consider the following statements regarding the impeachment of the President: (1) The motion for impeachment can be introduced only in the Lok Sabha. (2) It is necessary to give at least 14 days’ prior written notice to the President before bringing the motion. Which of the statement/s given above is/are correct?","options":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"answer":"b","explanation":"व्याख्या: अनुच्छेद 61 के तहत महाकभययग का प्रस्ताि सोंसद के ककस भ सदन (लयक सभा या राज्य सभा) में शुरू ककया जा सकता है , इसकलए कथन 1 गलत है । इस प्रस्ताि के कलए राष्टरपकत कय 14 कदन पूिव कलख्यखत सूचना दे ना अकनिायव है , अतः कथन 2 सह है ।"},{"id":41,"question":"Which of the following members participate in the impeachment process against the President, but do not participate in his election?","options":["Elected members of the Legislative Assemblies of the States","Members of the Legislative Assemblies of Delhi and Puducherry","Nominated members of both Houses of Parliament","Elected members of the State Legislative Councils"],"answer":"c","explanation":"व्याख्या: सोंसद के दयनयों सदनयों के मनयन त (नामाों ककत) सदस्य राष्टरपकत के चुनाि में ियट नह ों डालते, लेककन उन्हें महाकभययग क अद्व -न्याकयक प्रकक्रया में भाग लेने का अकधकार हयता है । इसके किपर त, राज्ययों क किधानसभाओों के कनिाव कचत सदस्य चुनाि में भाग लेते हैं परों तु महाकभययग में नह ।ों"},{"id":42,"question":"Who holds the ultimate authority to resolve disputes related to the election of the President and Vice-President?","options":["The Central Election Commission","The Parliament of India","The Supreme Court","The Central Ministry of Law"],"answer":"c","explanation":"व्याख्या: अनुच्छेद 71 के अनुसार, राष्टरपकत और उपराष्टरपकत के कनिाव चन से सोंिोंकधत सभ कििादयों और शोंकाओों क जाों च और किकनिय केिल उच्चतम न्यायालय द्वारा ककया जाता है और उसका कनणवय अोंकतम हयता है ।"},{"id":43,"question":"Under which Article does the President have the right to call a ‘Joint Sitting’ of both Houses of Parliament?","options":["Article 85","Article 108","Article 111","Article 123"],"answer":"b","explanation":"व्याख्या: यकद ककस साधारण किधेयक पर सोंसद के दयनयों सदनयों (लयक सभा और राज्य सभा) के मध्य मतभेद उत्पन्न हय जाता है , तय राष्टरपकत अनुच्छेद 108 के तहत गकतरयध दू र करने के कलए सोंयुक्त अकधिेशन आहूत कर सकता है ।"},{"id":44,"question":"Which of the following Bills can the President not return to the Parliament for reconsideration? (1) Money Bill (2) Ordinary Bill (3) Constitutional Amendment Bill Which of the statements given above is/are correct?","options":["Only 1 and 2","Only 2","Only 1 and 3","1, 2 and 3"],"answer":"c","explanation":"व्याख्या: अनुच्छेद 111 के तहत राष्टरपकत धन किधेयक कय पु नकिवचार के कलए नह ों लौटा सकता क्योंकक यह उसक पूिाव नुमकत से ह आता है । साथ ह , 24िें सोंशयधन (1971) के िाद सोंकिधान सोंशयधन किधेयक पर राष्टरपकत कय स्व कृकत दे ना िाध्यकार िना कदया गया है । साधारण किधेयक कय िह एक िार लौटा सकता है ।"},{"id":45,"question":"Under which Article of the Constitution does the President possess the ‘power to grant pardons’ in the judicial sphere?","options":["Article 71","Article 72","Article 143","Article 161"],"answer":"b","explanation":"व्याख्या: अनुच्छेद 72 के तहत राष्टरपकत कय सेना न्यायालय द्वारा कदए गए दों ड, सोंघ य किकधययों के किरुद् अपराध और सभ मामलयों में कदए गए मृत्युदोंड कय क्षमा, प्रकिलोंिन, पररहार, किराम या लघुकरण करने का अकधकार प्राप्त है ।"},{"id":46,"question":"Under which Article of the Constitution is the President authorized to ‘consult the Supreme Court’?","options":["Article 124","Article 131","Article 142","Article 143"],"answer":"d","explanation":"व्याख्या: अनुच्छेद 143 के तहत यकद राष्टरपकत कय लगता है कक कानून या तथ्य का कयई ऐसा प्रश्न उठा है जय सािवजकनक महत् का है , तय िह सुप्र म कयटव से राय माों ग सकता है । हालाों कक, िह इस राय कय मानने के कलए िाध्य नह ों है ।"},{"id":47,"question":"In the hierarchy of the Indian Constitution, the Vice-President holds the second position after the President. From the Constitution of which country is the office of the Vice-President inspired?","options":["Britain","Australia","America","Canada"],"answer":"c","explanation":"व्याख्या: अनुच्छेद 63 के अनुसार भारत का एक उपराष्टरपकत हयगा। भारत में उपराष्टरपकत के पद और उसक राज्यसभा के पदे न सभापकत के रूप में भूकमका सोंिोंध प्रािधान अमेररका के सोंकिधान से कलए गए हैं ।"},{"id":48,"question":"What is the main difference between the electoral colleges (Electors) of the President and the Vice-President?","options":["Nominated members of Parliament participate in the election of the Vice-President, whereas they do not participate in the election of the President.","Members of the Legislative Assemblies of the States do not participate in the election of the Vice-President, whereas they participate in the election of the President.","The electoral college for the Vice-President consists of only the members of the Lok Sabha.","Both options (a) and (b) are correct."],"answer":"d","explanation":"व्याख्या: राष्टरपकत के कनिाव चक मोंडल में सोंसद के केिल कनिाव कचत सदस्य और राज्ययों क किधानसभाओों के कनिाव कचत सदस्य हयते हैं । जिकक उपराष्टरपकत के कनिाव चक मोंडल में सोंसद के दयनयों सदनयों के सभ (कनिाव कचत + मनयन त) सदस्य शाकमल हयते हैं , परों तु राज्ययों क किधानसभाओों का इसमें कयई प्रकतकनकधत् नह ों हयता।"},{"id":49,"question":"A resolution for the removal of the Vice-President from office must mandatorily be introduced first in which House?","options":["In the Lok Sabha","In the Rajya Sabha","In either House of Parliament","In the Joint Sitting of Parliament"],"answer":"b","explanation":"व्याख्या: अनुच्छेद 67(ख) के अनुसार, उपराष्टरपकत कय पद से हटाने का प्रस्ताि अकनिायव रूप से केिल राज्यसभा में ह लाया जा सकता है , क्योंकक िह राज्यसभा का पदे न सभापकत हयता है । इसे राज्यसभा के तत्काल न सदस्ययों के िहुमत द्वारा पाररत और लयक सभा द्वारा सहमत हयना आिश्यक है ।"},{"id":50,"question":"By the 91st Constitutional Amendment Act (2003), what is the maximum number of ministers (including the Prime Minister) determined in the Union Council of Ministers?","options":["10% of the total membership of the Lok Sabha","15% of the total membership of the Lok Sabha","15% of the total membership of the Parliament","Maximum 100 ministers"],"answer":"b","explanation":"व्याख्या: 91िें सोंकिधान सोंशयधन द्वारा अनुच्छेद 75 में उपखण्ड (1क) जयडा गया, कजसके तहत केंद्र य मोंकत्रपररषद में प्रधानमोंत्र सकहत मोंकत्रययों क कुल सोंख्या लयक सभा क कुल सदस्य सोंख्या के 15% से अकधक नह ों हय सकत (अथाव त ितवमान पररप्रेक्ष्य में अकधकतम सोंख्या 82 हय सकत है )।"},{"id":51,"question":"With reference to the “Kitchen Cabinet” or “Inner Cabinet”, which of the following statements is correct?","options":["It is an informal small body consisting of 15 to 20 important ministers and non-parliamentary friends/family members.","It is explicitly mentioned in Article 74 of the Constitution.","Its decisions are legally binding on Parliament.","Only the Home Minister can chair it."],"answer":"a","explanation":"व्याख्या: ककचन कैकिनेट एक अनौपचाररक, गैर-सोंिैधाकनक लघु कनकाय है कजसमें प्रधानमोंत्र के अत्योंत किश्वसन य 15-20 लयग (कजसमें मोंत्र , कमत्र या पररिार के सदस्य भ हय सकते हैं ) शाकमल हयते हैं ।यह त व्र कनणवय लेने और गयपन यता िनाए रखने में मददगार हयता है।"},{"id":52,"question":"Consider the following statements regarding Constitutional Amendments: (1) The 25th Constitutional Amendment Act, 1971 inserted Article 31(C), under which the Directive Principles contained in Articles 39","options":["and 39","were given precedence over Articles 14, 19 and 31. (2) The 42nd Constitutional Amendment Act, 1976 expanded the scope of Article 31(C) to cover all Directive Principles of State Policy. (3) In Minerva Mills v. Union of India (1980), the Supreme Court struck down the expanded provision of Article 31(C) as being violative of the Basic Structure of the Constitution. Which of the above statements are correct?","1 and 2 only","2 and 3 only (c) 1 and 3 only (d) 1, 2 and 3"],"answer":"d","explanation":"व्याख्या: 25िें सोंकिधान सोंशयधन अकधकनयम, 1971 द्वारा अनुच्छेद 31C कय सोंकिधान में जयडा गया, कजसके अोंतगवत अनुच्छेद 39(b) एिों 39(c) में कनकहत राज्य के न कत-कनदे शक तत्यों कय लागू करने िाले कानूनयों कय अनुच्छेद 14, 19 तथा 31 के आधार पर चुनौत से सोंरक्षण प्रदान ककया गया। इसके पिात 42िें सोंकिधान सोंशयधन अकधकनयम, 1976 ने अनुच्छेद 31C के दायरे का किस्तार करते हुए यह सोंरक्षण सभ राज्य के न कत- कनदे शक तत्यों (Part IV) तक िढा कदया। हालाों कक, कमनिाव कमल्स िनाम भारत सोंघ (1980) मामले में सिोच्च न्यायालय ने इस किस्ताररत प्रािधान कय सोंकिधान क मूल सोंरचना के किरुद् मानते हुए असोंिैधाकनक घयकषत कर कदया। न्यायालय ने स्पष्ट ककया कक मौकलक अकधकार (Part III) और राज्य के न कत-कनदे शक तत् (Part IV) सोंकिधान के पूरक एिों परस्पर सोंतुकलत अोंग हैं तथा दयनयों के ि च सोंतुलन िनाए रखना सोंकिधान क मूल सोंरचना का अकभन्न तत् है ।"},{"id":53,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R): Assertion (A): The 42nd Constitutional Amendment Act, 1976 increased the normal tenure of the Lok Sabha and State Legislative Assemblies from five years to six years. Reason (R): The 44th Constitutional Amendment Act, 1978, while restoring the democratic system, reduced the tenure of the Lok Sabha and State Legislative Assemblies back to five years. Choose the correct answer using the code given below:","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"a","explanation":"व्याख्या: 42िें सोंकिधान सोंशयधन अकधकनयम, 1976 (कमन सोंकिधान) के माध्यम से आपातकाल के दौरान लयकसभा एिों राज्य किधानसभाओों का सामान्य कायवकाल पााँ च िषव से िढाकर छह िषव कर कदया गया था। इसका उद्दे श्य तत्काल न पररख्यस्थकतययों में कनिावकचत सदनयों क अिकध िढाना था। इसके िाद 44िें सोंकिधान सोंशयधन अकधकनयम, 1978 द्वारा इस प्रािधान कय समाप्त कर लयकताों कत्रक व्यिस्था क पुनस्थाव पना क गई तथा लयकसभा (अनुच्छेद 83) एिों राज्य किधानसभाओों (अनुच्छेद 172) का सामान्य कायवकाल पुनः पााँ च िषव कर कदया गया। इस प्रकार 44िें सोंकिधान सोंशयधन ने 42िें सोंशयधन द्वारा ककए गए पररितवन कय कनरस्त कर सोंकिधान क मूल लयकताों कत्रक व्यिस्था कय िहाल ककया, इसकलए कारण, अकभकथन क सह व्याख्या करता है ।"},{"id":54,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R): Assertion (A): The main objective of the 34th Constitutional Amendment Act, 1974 was to protect land reform laws from judicial challenge. Reason (R): By this amendment, several land reform laws were included in the Seventh Schedule of the Constitution. Choose the correct answer using the code given below:","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"c","explanation":"व्याख्या: • अकभकथन (A) सह है : 34िें सोंकिधान सोंशयधन (1974) का मुख्य उद्दे श्य किकभन्न राज्ययों के भूकम सुधार और भूकम स मा कनधावरण कानूनयों कय 'सोंपकत्त के मूल अकधकार' के उल्लोंघन के आधार पर अदालतयों में चुनौत कदए जाने से िचाना था। • कारण (R) गलत है : ककस भ कानून कय न्याकयक सम क्षा से सुरक्षा प्रदान करने के कलए उसे सोंकिधान क नौि ों अनुसूच में शाकमल ककया जाता है , न कक साति ों अनुसूच में। • अोंतर: साति ों अनुसूच का सों िोंध केिल केंद्र और राज्ययों के ि च शख्यक्तययों के िोंटिारे (सों घ , राज्य और समिती सूच ) से है , जिकक नौि ों अनुसूच कानूनयों कय सोंिैधाकनक किच दे त है । किशेष नयट: उच्चतम न्यायालय ने आई.आर. कयकहलय केस (2007) में स्पष्ट ककया है कक 24 अप्रैल 1973 के िाद नौि ों अनुसूच में डाले गए कानूनयों क भ न्याकयक सम क्षा क जा सकत है , यकद िे सोंकिधान के 'मूल ढाों चे' का उल्लोंघन करते हयों।"},{"id":55,"question":"Consider the following statements regarding the 51st Constitutional Amendment Act: (1) The 51st Constitutional Amendment Act, 1984 made constitutional provisions to ensure special representation for Scheduled Tribes in the Legislative Assemblies of Nagaland, Meghalaya, Mizoram and Arunachal Pradesh. (2) Under this amendment, Articles 330 and 332 were amended to take into account the special circumstances of the tribal population in these States. (3) The objective of this amendment was to expand the powers of Autonomous District Councils under the Sixth Schedule. Which of the above statements are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: 51िें सोंकिधान सोंशयधन अकधकनयम, 1984 का उद्दे श्य नागालैंड, मेघालय, कमजयरम एिों अरुणाचल प्रदे श क किकशष्ट जनजात य सोंरचना कय ध्यान में रखते हुए लयकसभा तथा राज्य किधानसभाओों में अनुसूकचत जनजाकतययों के कलए पयाव प्त प्रकतकनकधत् सुकनकित करना था। इसके कलए अनुच्छेद 330 एिों अनुच्छेद 332 में आिश्यक सोंशयधन ककए गए। यह सोंशयधन छठ अनुसूच के अोंतगवत स्वायत्त कजला पररषदयों क शख्यक्तययों में िृख्यद् से सोंिोंकधत नह ों था। स्वायत्त कजला पररषदयों का गठन एिों उनक शख्यक्तयााँ सोंकिधान क छठ अनुसूच द्वारा किकनयकमत हयत हैं और 51िें सोंशयधन का उनसे प्रत्यक्ष सोंिोंध नह ों था।"},{"id":56,"question":"With reference to various provisions of the Constitution of India and the procedures for their amendment, consider the following statements: (1) Under Articles 2 and 3, Bills relating to the formation of new States or alteration of the boundaries, area or name of existing States are passed by Parliament by a simple majority. (2) The acquisition, termination and other matters relating to citizenship are regulated by Parliament under Article 11 through an Ordinary Law. (3) Changes made under Articles 2, 3 and 11 are regarded as Constitutional Amendments under Article 368. Which of the above statements is/are correct?","options":["1 and 2 only","2 and 3 only","1 only","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: • कथन 1 सह है : अनुच्छेद 4 में स्पष्ट रूप से कहा गया है कक अनुच्छेद 2 और 3 के तहत िनाए गए कानून सोंसद के साधारण िहुमत से पाररत ककए जाएों गे। • कथन 2 सह है : अनुच्छेद 11 सोंसद कय नागररकता के अकधकार कय कानून (साधारण किकध) द्वारा किकनयकमत करने क शख्यक्त दे ता है । • कथन 3 गलत है : अनुच्छेद 4(2) के अनुसार, नए राज्ययों का गठन या स माओों में पररितवन अनुच्छेद 368 के प्रययजनयों के कलए सोंकिधान का सोंशयधन नह ों माना जाता है । इस तरह, नागररकता कानून में िदलाि भ अनुच्छेद 368 क पररकध से िाहर साधारण िहुमत द्वारा हयता है ।"},{"id":57,"question":"With reference to the procedures for amendment of the Constitution of India, consider the following statements: (1) The provisions of the Fifth and Sixth Schedules can be amended by a simple majority of both Houses of Parliament. (2) The removal of Judges of the Supreme Court and High Courts requires a special majority of Parliament. (3) Certain amendments passed by Parliament by a simple majority are not regarded as Constitutional Amendments under Article 368. Which of the above statements are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"d","explanation":"व्याख्या: • कथन 1 सह है : सोंकिधान क पाों चि ों अनुसूच (अनुसूकचत क्षेत्रयों और अनुसूकचत जनजाकतययों का प्रशासन) और छठ अनुसूच (असम, मे घालय, कत्रपुरा और कमजयरम के जनजात य क्षेत्रयों का प्रशासन) में कयई भ िदलाि सोंसद साधारण िहुमत से कर सकत है । • कथन 2 सह है : उच्चतम न्यायालय (SC) और उच्च न्यायालय (HC) के न्यायाध शयों कय हटाने का प्रस्ताि सोंसद के किशेष िहुमत (सदन क कुल सदस्यता का िहुमत तथा उपख्यस्थत और मतदान करने िाले सदस्ययों का कम से कम दय-कतहाई िहुमत) द्वारा पाररत हयना अकनिायव है । • कथन 3 सह है : अनुच्छेद 11 (नागररकता), अनुच्छेद 2 और 3 (नए राज्ययों का गठन/स मा पररितवन) तथा पाों चि /ों छठ अनुसूच जैसे मामलयों में साधारण िहुमत से ककए गए िदलाियों कय अनु च्छेद 368 के तहत औपचाररक 'सोंकिधान सोंशयधन' नह ों कगना जाता है ।"},{"id":58,"question":"Under the Constitution of India, with reference to amendments/provisions that may be made by simple majority of Parliament, which of the following options is incorrect?","options":["Provisions relating to changes in the rules of quorum in Parliament and extension of the period for the use of the English language in Parliament are decided by a simple majority.","A law defining the powers, privileges and immunities of Parliament, its members and its committees is passed by Parliament by a simple majority.","The creation or abolition of a Legislative Council in a State requires a simple majority in Parliament, provided the concerned State Legislative Assembly has passed a resolution to that effect by a special majority.","Since matters relating to quorum, parliamentary privileges and the creation of Legislative Councils are amended by a simple majority, they are introduced as Constitution Amendment Bills under Article 368."],"answer":"d","explanation":"व्याख्या: • किकल्प (a) और (b) सह हैं : सोंसद में गणपूकतव (अनुच्छेद 100), राजभाषा या अोंग्रेज का प्रययग (अनुच्छेद 120), और सोंसद य किशेषाकधकार (अनुच्छेद 105) ऐसे किषय हैं कजनमें िदलाि या कानून कनमाव ण सोंसद अपने साधारण िहुमत से करत है । • किकल्प (c) सह है : अनुच्छेद 169 के तहत ककस राज्य में किधान पररषद िनाने या हटाने के कलए सोंिोंकधत राज्य क किधानसभा कय किशेष िहुमत से प्रस्ताि पास करना हयता है , लेककन जि िह प्रस्ताि सोंसद में आता है , तय सोंसद उसे केिल साधारण िहुमत से ह पास करत है । • किकल्प (d) गलत है : सोंकिधान के अनुच्छेद 11, अनुच्छेद 4, और अनुच्छेद 169(3) में स्पष्ट रूप से कलखा गया है कक साधारण िहुमत से ककए गए इन िदलाियों कय अनुच्छेद 368 के प्रययजनयों के कलए 'सोंकिधान सोंशयधन' नह ों माना जाएगा। इसकलए इन्हें सामान्य किधेयकयों क तरह पेश ककया जाता है , न कक सोंकिधान सोंशयधन किधेयक के रूप में।"},{"id":59,"question":"Which Constitutional Amendment Act was enacted to implement the recommendations of the States Reorganisation Commission (SRC)?","options":["5th Constitutional Amendment, 1955","7th Constitutional Amendment, 1956","14th Constitutional Amendment, 1962","18th Constitutional Amendment, 1966"],"answer":"b","explanation":"व्याख्या: राज्य पुनगवठन आययग का गठन 29 कदसोंिर, 1953 कय न्यायमूकतव फ़ज़ल अल क अध्यक्षता में ककया गया था। आययग ने 1955 में अपन ररपयटव प्रस्तुत क , कजसमें राज्ययों के पुनगवठन का प्रमुख आधार भाषाय कसद्ाों त रखने क अनुशोंसा क गई। आययग क कसफाररशयों कय लागू करने के कलए राज्य पुनगवठन अकधकनयम, 1956 के साथ-साथ 7िें सोंकिधान सोंशयधन अकधकनयम, 1956 कय लागू ककया गया। इस सोंशयधन द्वारा सोंकिधान में आिश्यक पररितवन ककए गए तथा भाग A, B, C और D राज्ययों क पुरान व्यिस्था समाप्त कर 14 राज्ययों एिों 6 सोंघ राज्य क्षेत्रयों क नई व्यिस्था स्थाकपत क गई। अतः राज्य पुनगवठन आययग क कसफाररशयों कय सोंिैधाकनक रूप से लागू करने के कलए 7िााँ सोंकिधान सोंशयधन अकधकनयम, 1956 पाररत ककया गया था।"},{"id":60,"question":"Consider the following statements: (1) Under Article 368, a Constitution Amendment Bill may be introduced in either House of Parliament, and not only in the Lok Sabha. (2) Amendment of Fundamental Rights requires, in addition to a special majority, the prior recommendation of the President. (3) Like a Money Bill, the powers of the Rajya Sabha are limited in the case of a Constitution Amendment Bill. How many of the above statements are correct?","options":["Only one","Only two","All three","None of the above"],"answer":"a","explanation":"व्याख्या: कथन 1 सह है — सोंकिधान सोंशयधन किधेयक लयकसभा या राज्यसभा, ककस भ सदन में शुरू हय सकता है । कथन 2 गलत है — मौकलक अकधकारयों में सोंशयधन हे तु राष्टरपकत क पूिाव नुमकत क आिश्यकता नह ों हयत । कथन 3 गलत है — सोंकिधान सोंशयधन के मामले में दयनयों सदनयों कय समान शख्यक्तयााँ प्राप्त हैं ; असहमकत क ख्यस्थकत में सोंयुक्त िैठक का प्रािधान नह ों है , किधेयक कनरस्त हय जाता है ।"},{"id":61,"question":"Match List-I (Constitutional Amendment Acts) with List-II (Major Provisions) and choose the correct answer using the code given below: List-I (Amendment Act) List-II (Major Provision) A. 42nd Constitutional Amendment Act, 1976 Removal of the Right to Property from the list of Fundamental Rights B. 44th Constitutional Amendment Act, 1978 Right to Education (Insertion of Article 21A) C. 73rd Constitutional Amendment Act, 1992 Constitutional status to Panchayati Raj Institutions D. 86th Constitutional Amendment Act, 2002 Addition of the words \"Socialist\", \"Secular\" and \"Integrity\" in the Preamble Code: A B C D","options":["4","1","4","2"],"answer":"a","explanation":"व्याख्या: • 42िाों सोंशयधन (1976): इसे 'लघु सोंकिधान' भ कहा जाता है । इसके तहत प्रस्तािना में त न नए शब्द जयडे गए थे। • 44िाों सोंशयधन (1978): इसके द्वारा सोंपकत्त के अकधकार कय अनुच्छेद 31 से हटाकर अनुच्छेद 300A के तहत एक कानून अकधकार िनाया गया। • 73िाों सोंशयधन (1992): इसके द्वारा सोंकिधान में भाग-9 और 11ि ों अनुसूच जयडकर पोंचायतयों कय सोंिैधाकनक मान्यता द गई। • 86िाों सोंशयधन (2002): इसके तहत 6 से 14 िषव तक के िच्चयों के कलए 'कशक्षा के अकधकार' कय अनुच्छेद 21A के अोंतगवत मूल अकधकार िनाया गया।"},{"id":62,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R): Assertion (A): The 42nd Constitutional Amendment Act is known as the “Mini Constitution.” Reason (R): This amendment gave precedence to the Directive Principles of State Policy over the Fundamental Rights and attempted to make Parliament’s amending power unlimited. Choose the correct answer using the code given below:","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"a","explanation":"व्याख्या: • अकभकथन (A) सह है : 42िें सोंशयधन (1976) ने सोंकिधान के प्रस्तािना, मौकलक अकधकार, न्यायपाकलका आकद सकहत लगभग हर िडे कहस्से में िदलाि ककए। इस अभूतपूिव व्यापकता के कारण इसे \"लघु सोंकिधान\" कहा जाता है । • कारण (R) सह है और सह व्याख्या करता है : यह कारण इसके \"लघु सोंकिधान\" हयने के चररत्र कय साकित करता है क्योंकक इसके द्वारा: 1. सभ न कत कनदे शक तत्यों (DPSP) कय मौकलक अकधकारयों पर िर यता द गई। 2. अनुच्छेद 368 में सोंशयधन कर सोंसद क सोंकिधान सोंशयधन क शख्यक्त कय अस कमत िनाने का प्रयास ककया गया (ताकक न्यायालय इसे चुनौत न दे सके)। नयट: िाद में उच्चतम न्यायालय ने कमनिाव कमल्स मामले (1980) में सोंसद क इस अस कमत शख्यक्त कय असोंिैधाकनक घयकषत कर कदया था।"},{"id":63,"question":"Consider the following statements regarding the 103rd and 105th Constitutional Amendment Acts: (1) The 103rd Amendment relates to 10% reservation for the Economically Weaker Sections (EWS). (2) The 105th Amendment restores the power of the States to identify Socially and Educationally Backward Classes (SEBCs). (3) Both amendments involve changes relating to Article 342A. Which of the above statement(s) is/are correct?","options":["1 only","1 and 2","2 and 3","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: • 103िाों सोंशयधन (2019): इसने सोंकिधान में अनुच्छेद 15(6) और 16(6) जयडकर सामान्य िगव के आकथवक रूप से कमजयर लयगयों कय 10% EWS आरक्षण कदया। सुप्र म कयटव ने जनकहत अकभयान केस (2022) में इसे िैध माना। • 105िाों सोंशयधन (2021): इसने मराठा आरक्षण केस के िाद उपजे भ्रम कय दू र ककया और राज्ययों कय अपन OBC सूच िनाने क शख्यक्त िापस द , कजससे भारत य सोंघ य ढाों चा मजिूत हुआ। • अनुच्छेद 342A: यह अनुच्छेद मूल रूप से 102िें सोंशयधन (2018) द्वारा जयडा गया था (कजसने राष्टर य कपछडा िगव आययग कय सोंिैधाकनक दजाव कदया)। इसका EWS (103िें) से कयई सोंिोंध नह ों है ।"},{"id":64,"question":"With reference to the composition of the Constituent Assembly, consider the following statements: (1) Members of the Constituent Assembly were directly elected by the members of the Provincial Legislative Assemblies on the basis of adult franchise. (2) After Partition, the total strength of the Indian Constituent Assembly was reduced from 389 to 299. (3) The Provincial seats were distributed only between two communities—Muslims and Sikhs—in proportion to their population. Which of the above statements is/are correct?","options":["1 and 2 only","2 only","2 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: सोंकिधान सभा के सदस्ययों का चुनाि प्राों त य किधान सभा के सदस्ययों द्वारा स कमत मताकधकार के आधार पर अप्रत्यक्ष रूप से ककया गया था, न कक प्रत्यक्ष या ियस्क मताकधकार के आधार पर। अतः कथन 1 गलत है । भारत के किभाजन के पररणामस्वरूप, कुछ क्षेत्र पाककस्तान में चले गए, कजससे सोंकिधान सभा क कुल स टयों क सोंख्या मूल 389 से घटकर 299 हय गई। अतः कथन 2 किल्कुल सह है । किकटश प्राों तयों क स टयों कय त न प्रमुख समुदाययों—मुसलमान, कसख और आम लयग (सामान्य) में उनक जनसोंख्या के अनुपात में किभाकजत ककया गया था, न कक केिल दय समुदाययों में। अतः कथन 3 गलत है ।"},{"id":65,"question":"Which of the following statements regarding the functions of the Constituent Assembly is/are correct? (1) In May 1949, the Constituent Assembly ratified/confirmed India’s membership of the Commonwealth. (2) The National Flag was adopted by the Constituent Assembly on 24 January 1950. (3) Dr. Rajendra Prasad was elected as the first President of India on 22 July 1947. Choose the correct answer using the code given below:","options":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: सोंकिधान सभा ने मई 1949 में राष्टरमोंडल क सदस्यता के पोंज करण में सुधार (पुकष्ट) ककया था, इसकलए कथन 1 सह है । राष्टर य ध्वज कय 22 जुलाई 1947 कय अपनाया गया था, न कक 24 जनिर 1950 कय (कथन 2 गलत है )। इसके अकतररक्त, डॉ. राजेंद्र प्रसाद कय 24 जनिर 1950 कय सोंकिधान सभा द्वारा भारत का पहला राष्टरपकत चुना गया था, न कक 22 जुलाई 1947 कय। इसकलए कथन 3 भ गलत है । इस प्रकार केिल पहला कथन ह ऐकतहाकसक रूप से और कदए गए तथ्ययों के अनुसार सत्य है ।"},{"id":66,"question":"Consider the following pairs regarding the Committees of the Constituent Assembly and their Chairpersons: Committee Chairperson 1. Union Powers Committee Jawaharlal Nehru 2. Provincial Constitution Committee R. Ambedkar 3. Rules of Procedure Committee Rajendra Prasad 4. House Committee Pattabhi Sitaramayya How many of the above pairs are correctly matched?","options":["Only one pair","Only two pairs","Only three pairs","All four pairs"],"answer":"c","explanation":"व्याख्या: सोंघ शख्यक्त सकमकत के अध्यक्ष जिाहरलाल नेहरू थे (युग्म 1 सह है )। प्राों त य सोंकिधान सकमकत के अध्यक्ष िल्लभभाई पटे ल थे, जिकक डॉ. ि .आर. अोंिेडकर मसौदा सकमकत के अध्यक्ष थे, इसकलए युग्म 2 गलत सुमेकलत है । कायवप्रणाल सकमकत के कनयम के अध्यक्ष डॉ. राजेंद्र प्रसाद थे (युग्म 3 सह है )। सदन सकमकत के अध्यक्ष ि . पट्टाभ स तारामय्या थे (युग्म 4 सह है )। चूोंकक चार में से त न युग्म (1, 3, और 4) सह सुमेकलत हैं , इसकलए सह किकल्प (c) है ।"},{"id":67,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R): Assertion (A): The Objectives Resolution, moved by Jawaharlal Nehru on 13 December 1946, ultimately became the Preamble of the Constitution of independent India. Reason (R): The Objectives Resolution laid down the basic principles and philosophy that were to guide the framing of the Constitution of an independent sovereign republic. Choose the correct answer using the code given below:","options":["Both (A) and (R) are true, and (R) is the correct explanation of (A).","Both (A) and (R) are true, but (R) is not the correct explanation of (A).","(A) is true, but (R) is false.","(A) is false, but (R) is true."],"answer":"a","explanation":"व्याख्या: पोंकडत जिाहरलाल नेहरू ने 13 कदसोंिर, 1946 कय ऐकतहाकसक 'उद्दे श्य प्रस्ताि' पेश ककया था, कजसे 22 जनिर , 1947 कय सिवसम्मकत से स्व कार ककया गया। यह प्रस्ताि आगे चलकर भारत य सोंकिधान क प्रस्तािना का आधार िना। अतः कथन (A) सह है । इसका कारण यह है कक इस प्रस्ताि में भारत कय एक सोंप्रभु लयकताों कत्रक गणराज्य घयकषत करने के साथ-साथ नागररकयों के कलए न्याय, समानता, स्वतोंत्रता और अल्पसोंख्यकयों/कपछडयों के कहतयों क रक्षा जैसे मागवदशवक कसद्ाों तयों और दशवन कय समाकहत ककया गया था, कजसने सोंकिधान के पूरे ढाों चे कय आकार कदया। अतः कारण (R) भ सह है और यह कथन क सह व्याख्या करता है ।"},{"id":68,"question":"With reference to the Drafting Committee of the Indian Constitution, consider the following statements: (1) The Drafting Committee was constituted on 29 August 1947, immediately after Independence. (2) The Committee consisted of seven members and was chaired by Dr. B. R. Ambedkar. (3) After the resignation/removal of B. L. Mitter, T. T. Krishnamachari was inducted into the Committee in his place. Which of the above statements is/are not correct?","options":["1 and 2 only","3 only","2 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: मसौदा सकमकत क स्थापना 29 अगस्त, 1947 कय हुई थ और इसका प्राथकमक कायव सोंकिधान का मसौदा तैयार करना था (कथन 1 सह है )। इस सकमकत में अध्यक्ष सकहत कुल सात सदस्य थे और इसके प्रमुख डॉ. ि .आर. अोंिेडकर थे (कथन 2 सह है )। सकमकत के अन्य सदस्ययों में िदलाि के सोंिोंध में यह तथ्य है कक ि .एल. कमटर के स्थान पर एन. माधिा राउ कय कनयुक्त ककया गया था, जिकक ड प खैतान क मृत्यु/स्थान पर ट .ट . कृष्णमाचार कय कनयुक्त ककया गया था। कथन 3 में ि .एल. कमटर के स्थान पर ट .ट . कृष्णमाचार का नाम कदया गया है , जय कक गलत है । प्रश्न में 'सह नह 'ों पूछा गया है , इसकलए उत्तर (b) हयगा।"},{"id":69,"question":"Consider the following statements regarding the commencement of the Constitution of India: (1) On 26 November 1949, certain Articles relating to citizenship, such as Articles 5 to 9, came into force immediately. (2) After the Constitution came into full operation, both the Government of India Act, 1935 and the Indian Independence Act, 1947 were repealed. (3) The original Constitution was adopted on 26 November 1949 with 448 Articles and 12 Schedules. Which of the above statements is/are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: 26 निोंिर, 1949 कय जि सोंकिधान अपनाया गया, तय उसके कुछ प्रािधान (जैसे नागररकता से सोंिोंकधत अनुच्छेद 5, 6, 7, 8, 9 आकद तथा अनुच्छेद 379, 380 आकद) तुरोंत प्रभाि हय गए थे। अतः कथन 1 सह है । 26 जनिर , 1950 कय सोंकिधान के पूणव प्रितवन के साथ ह , पूिविती किकटश कानून जैसे भारत सरकार अकधकनयम 1935 और भारत य स्वतोंत्रता अकधकनयम 1947 कनरस्त हय गए (कथन 2 सह है )। 26 निोंिर, 1949 कय अपनाए गए मूल सोंकिधान में 395 अनुच्छेद और 8 अनुसूकचयाों थ ।ों ितवमान में इसमें 448 अनुच्छेद और 12 अनुसूकचयाों हैं । अतः कथन 3 गलत है ।"},{"id":70,"question":"With reference to the integration of the Princely States into the Constituent Assembly, consider the following events: (1) Acceptance of the Mountbatten Plan (3 June 1947). (2) Formal participation of the representatives of six Princely States in the Constituent Assembly. (3) Presentation of the Objectives Resolution by Jawaharlal Nehru. (4) Representatives of most of the remaining Princely States taking their seats in the Constituent Assembly. What is the correct chronological order of the above events?","options":["3–2–1–4","2–3–1–4","3–1–2–4","1–3–2–4"],"answer":"a","explanation":"व्याख्या: ऐकतहाकसक तथ्ययों के आधार पर घटनाओों का सह क्रम इस प्रकार है : • सिसे पहले, 13 कदसोंिर, 1946 कय जिाहरलाल नेहरू ने उद्दे श्य प्रस्ताि पेश ककया (घटना 3)। • इसके िाद, 28 अप्रैल, 1947 कय छह राज्ययों के प्रकतकनकधययों के शाकमल हयने के साथ ररयासतयों का सभा में औपचाररक प्रिेश शुरू हुआ (घटना 2)। • कफर, 3 जून, 1947 कय दे श के किभाजन के कलए माउों टिेटन ययजना कय स्व कार ककया गया (घटना 1)। • इस ययजना क स्व कृकत के िाद, अकधकाों श अन्य ररयासतयों के प्रकतकनकधययों ने किधानसभा में अपन स टें ग्रहण क ों (घटना 4)। अतः सह कालानुक्रकमक क्रम 3-2-1-4 है , जय किकल्प (a) कय दशाव ता है ।"},{"id":71,"question":"With reference to the Translation Committees constituted under the Constituent Assembly, consider the following statements: (1) The responsibility of translating the Constitution into Hindi was entrusted to the committee headed by Alladi Krishnaswami Ayyar. (2) The committee for translating the Constitution into Urdu was chaired by Mohammad Saadulla. Which of the above statements is/are correct?","options":["1 only","2 only","1 and 2 both","Neither 1 nor 2"],"answer":"c","explanation":"व्याख्या: सोंकिधान सभा ने किकभन्न भाषाओों में सोंकिधान के सुचारू अनुिाद के कलए किशेष सकमकतययों का गठन ककया था। कहों द अनुिाद सकमकत के अध्यक्ष अल्लाद कृष्णस्वाम अय्यर थे , जय सोंकिधान के पाठ का आकधकाररक कहों द सोंस्करण तैयार करने के कलए कजम्मेदार थे। अतः कथन 1 सह है । इस प्रकार, उदू व अनुिाद सकमकत क अध्यक्षता मुहम्मद सादु ल्लाह कय सौोंप गई थ , जय मसौदा सकमकत के भ सदस्य थे। अतः कथन 2 भ सह है । चूोंकक दयनयों कथन कदए गए पाठ के अनुसार सत्य हैं , इसकलए किकल्प (c) सह उत्तर है ।"},{"id":72,"question":"With reference to the philosophy of the Objectives Resolution, which of the following provisions were included in it? (1) Declaring India as a Sovereign Democratic Republic. (2) Ensuring a federal system of government with distribution of powers between the Centre and the States. (3) Providing special safeguards for the protection of the interests of backward, tribal areas and the depressed classes. Choose the correct answer using the code given below:","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"d","explanation":"व्याख्या: 13 कदसोंिर 1946 कय नेहरू ज द्वारा पेश ककए गए उद्दे श्य प्रस्ताि में भारत य सोंिैधाकनक सोंरचना के मूल दशवन कय पररभाकषत ककया गया था। इस प्रस्ताि में स्पष्ट रूप से कहा गया था कक भारत एक स्वतोंत्र सोंप्रभु लयकताों कत्रक गणराज्य हयगा (कथन 1 सह है )। इसमें एक ऐस सोंघ य व्यिस्था क पररकल्पना क गई थ जहाों केंद्र और राज्ययों के ि च शख्यक्तययों का स्पष्ट किभाजन हयगा (कथन 2 सह है )। इसके साथ ह , इसमें सामाकजक न्याय सुकनकित करने के कलए कपछडे िगों, आकदिास क्षेत्रयों, दकलतयों और अन्य अल्पसोंख्यक समूहयों के कहतयों क रक्षा के कलए पयावप्त सुरक्षा उपाययों का िादा ककया गया था (कथन 3 सह है )। अतः त नयों कथन सह हैं ।"},{"id":73,"question":"With reference to the Preamble of the Indian Constitution, consider the following statements: (1) The main ideological basis of the Preamble was the Objectives Resolution moved by Jawaharlal Nehru, which was adopted by the Constituent Assembly on 26 November 1949. (2) Though not directly enforceable in a court of law, it serves as an aid in the interpretation of the Articles of the Constitution. Which of the above statements is/are correct?","options":["1 only","2 only","1 and 2 both","Neither 1 nor 2"],"answer":"b","explanation":"व्याख्या: कथन 1 गलत है क्योंकक सोंकिधान सभा द्वारा 'उद्दे श्य प्रस्ताि' कय 22 जनिर 1947 कय अपनाया गया था, न कक 26 निोंिर 1949 कय। 26 निोंिर 1949 िह ऐकतहाकसक कतकथ है जि सोंकिधान (प्रस्तािना सकहत) कय अपनाया और अोंग कृत ककया गया था। कथन 2 किल्कुल सह है , प्रस्तािना हालाों कक अदालत में स धे लागू या प्रितवन य नह ों है , लेककन जि भ सोंकिधान के ककस अनुच्छेद क भाषा सोंकदग्ध या अस्पष्ट पाई जात है , तय न्यायपाकलका इसके सह अथव कय समझने और व्याख्या करने के कलए प्रस्तािना कय एक मागवदशवक और सहायक उपकरण के रूप में उपययग करत है ।"},{"id":74,"question":"With reference to the word “Socialist” mentioned in the Indian Preamble, consider the following statements: (1) India has committed itself to achieving socialist goals through democratic means. (2) Indian socialism believes in a mixed economy where both private and public sectors coexist. (3) This word was included in the original Preamble from the time of the framing of the Constitution. How many of the above statements are correct?","options":["Only one statement","Only two statements","All three statements","None of the statements"],"answer":"b","explanation":"व्याख्या: कथन 1 और 2 सह हैं । भारत का समाजिाद 'लयकताों कत्रक समाजिाद' है , जय लयकताों कत्रक साधनयों के माध्यम से समाजिाद उद्दे श्ययों कय प्राप्त करने का प्रयास करता है । यह एक कमकश्रत अथवव्यिस्था का समथवन करता है जहााँ सािवजकनक (सरकार ) और कनज क्षेत्र कोंधे से कोंधा कमलाकर काम करते हैं । कथन 3 गलत है क्योंकक 'समाजिाद ' शब्द मूल प्रस्तािना में मौजूद नह ों था। इसे िाद में आपातकाल के दौरान 42िें सोंकिधान सोंशयधन अकधकनयम, 1976 द्वारा प्रस्तािना में जयडा गया था। अतः केिल दय कथन सह हैं ।"},{"id":75,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R): Assertion (A): In the Indian context, Liberty means giving citizens complete and unlimited freedom to do anything in society. Reason (R): Liberty without equality would lead to the domination of the majority or a few powerful people in society. Choose the correct answer using the code given below:","options":["Both A and R are true and R is the correct explanation of A.","Both A and R are true but R is not the correct explanation of A.","A is true but R is false.","A is false but R is true."],"answer":"d","explanation":"व्याख्या: अकभकथन (A) गलत है क्योंकक प्रस्तािना में 'स्वतोंत्रता' का अथव किना ककस कनयोंत्रण के कुछ भ करने का लाइसेंस नह ों है । नागररकयों कय अपने ज िन का तर का चुनने क आजाद है , लेककन यह केिल कानून द्वारा स्थाकपत स माओों के भ तर ह सोंभि है । कारण (R) किल्कुल सह और सोंकल्पनात्मक रूप से सुदृढ है । ि .आर. अोंिेडकर के किचारयों के अनुसार, स्वतोंत्रता, समानता और िोंधुत् एक कत्रमूकतव हैं । यकद समानता के किना स्वतोंत्रता द जाएग , तय शख्यक्तशाल लयग कमजयरयों पर हाि हय जाएों गे , कजससे चोंद लयगयों का िचवस्व स्थाकपत हय जाएगा। अतः (A) गलत है और (R) सह है ।"},{"id":76,"question":"Match the following forms of Justice mentioned in the Preamble of the Indian Constitution with their correct descriptions: (1) Social Justice: Equal right to participate in political opportunities without any discrimination. (2) Economic Justice: Absence of discrimination on the basis of wealth, income and economic status, and equal pay for equal work. (3) Political Justice: Creation of a society free from discrimination based on caste, creed, sex or religion. Which of the above pairs is/are correctly matched?","options":["2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: युग्म 1 और 3 गलत सुमेकलत हैं : सामाकजक न्याय का तात्पयव एक ऐसे समाज के कनमाव ण से है जहााँ जाकत, िगव, कलोंग या धमव के आधार पर कयई भेदभाि न हय। राजन कतक न्याय का अथव है कक प्रत्येक नागररक कय किना ककस भेदभाि के राजन कतक प्रकक्रयाओों और अिसरयों में स्वतोंत्र और कनष्पक्ष रूप से भाग लेने का अकधकार हय। युग्म 2 पूर तरह से सह सुमेकलत है ; आकथवक न्याय यह सुकनकित करता है कक सोंपकत्त या आय के आधार पर इों सानयों के ि च भेदभाि न हय और सभ कय आज किका के समान अिसर कमलें।"},{"id":77,"question":"With reference to the landmark judgments delivered by the judiciary, consider the following statements: (1) In the Berubari Union Case (1960), the Supreme Court explicitly held that the Preamble is an integral part of the Constitution. (2) In the Kesavananda Bharati Case (1973), the Court reversed its earlier view and declared that the Preamble is a part of the Constitution. (3) In the LIC of India Case (1995), the Supreme Court reaffirmed that the Preamble is an integral part of the Constitution. Which of the above statements is/are correct?","options":["1 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: कथन 1 गलत है क्योंकक िेरुिार मामले (1960) में सिोच्च न्यायालय ने कहा था कक हालाों कक 'प्रस्तािना कनमाव ताओों के मन कय खयलने क कुोंज है ', कफर भ इसे सोंकिधान का कहस्सा नह ों माना जा सकता है । कथन
