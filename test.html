2 सह है क्योंकक केशिानोंद भारत मामले (1973) में 13 न्यायाध शयों क प ठ ने िेरुिार के फैसले कय पलटते हुए माना कक प्रस्तािना सोंकिधान का कहस्सा है । कथन 3 भ सह है ; 1995 के एलआईस ऑफ इों कडया मामले में न्यायालय ने अपने रुख कय दयहराया कक प्रस्तािना सोंकिधान का एक अकभन्न अोंग है , हालाों कक यह अदालतयों में स धे प्रितवन य नह ों है ।"},{"id":78,"question":"Which of the following statements is incorrect regarding the changes made in the Preamble by the 42nd Constitutional Amendment Act, 1976?","options":["This amendment added three new words to the Preamble—”Socialist”, “Secular” and “Integrity”.","The words “Socialist” and “Secular” were inserted between “Sovereign” and “Democratic”.","Through this amendment, the phrase “Unity of the Nation” was changed to “Unity and Integrity of the Nation”.","This amendment made the Preamble subject to judicial review and directly enforceable in courts."],"answer":"d","explanation":"व्याख्या: कथन (d) पूर तरह से गलत है । 42िें सोंशयधन अकधकनयम, 1976 ने प्रस्तािना क मूल प्रकृकत कय नह ों िदला कक िह अदालत में प्रितवन य है या नह ।ों प्रस्तािना आज भ गैर-न्याययकचत है , कजसका अथव है कक इसके प्रािधानयों के उल्लोंघन के आधार पर सरकार के ख्यखलाफ कयई स धे अदालत नह ों जा सकता। कथन (a), (b), और (c) किल्कुल सह हैं । इसके द्वारा 'समाजिाद ' और 'पोंथकनरपेक्ष' शब्द जयडे गए तथा 'राष्टर क एकता' कय 'राष्टर क एकता और अखोंडता' में िदला गया।"},{"id":79,"question":"With reference to the adoption and commencement of the Indian Constitution, consider the following statements: (1) According to Article 394, certain important Articles relating to citizenship, elections and temporary provisions came into force on 26 November 1949 itself. (2) All the remaining major provisions of the Constitution came into force on 26 January 1950, which is celebrated as India’s Republic Day. Which of the above statements is/are correct?","options":["1 only","2 only","1 and 2 both","Neither 1 nor 2"],"answer":"c","explanation":"व्याख्या: दयनयों कथन 1 और 2 किल्कुल सह हैं । प्रस्तािना में सोंकिधान कय अपनाने क कतकथ 26 निोंिर 1949 िताई गई है । सोंकिधान के अनुच्छेद 394 के किकशष्ट प्रािधानयों के अनुसार, कुछ महत्पूणव अनुच्छेद जैसे कक अनुच्छेद 5, 6, 7, 8, 9 (नागररकता), 60 (राष्टरपकत द्वारा शपथ), 324 (चुनाि आययग), 367, 379 और स्वयों 394 कय उस कदन यान 26 निोंिर 1949 कय तुरोंत लागू कर कदया गया था। इसके िाद, सोंकिधान के िाक सभ िडे और िुकनयाद कहस्से दय मह ने िाद 26 जनिर 1950 कय लागू हुए।"},{"id":80,"question":"Consider the following statements: (1) The word “Republic” in the Indian Preamble indicates that the Head of the State is elected directly or indirectly by the people and is not hereditary. (2) Being “Sovereign” means that the Indian Legislature can make laws without the control of any external country, but such laws are completely beyond all limits and restraints. Which of the above statements is/are correct?","options":["1 only","2 only","1 and 2 both","Neither 1 nor 2"],"answer":"a","explanation":"व्याख्या: कथन 1 सह है क्योंकक 'गणराज्य' शब्द का अथव ह यह है कक राज्य का मुख्यखया (भारत में राष्टरपकत) एक कनकित अिकध के कलए कनिाव कचत हयता है , िह किटे न क तरह कयई राजा या रान नह ों हयता। कथन 2 गलत है क्योंकक भारत एक सोंप्रभु राज्य है और अपन स्वतोंत्र सत्ता रखता है , लेककन दे श के भ तर किधाकयका कय कानून िनाने क जय शख्यक्त प्राप्त है , िह पूर तरह अस कमत नह ों है िख्यल्क 'कुछ स माओों' के अध न है , जैसे कक सोंिैधाकनक मयाव दाएों ।"},{"id":81,"question":"What is the historical source of the ideals of “Liberty, Equality and Fraternity” incorporated in the Preamble of the Indian Constitution?","options":["The American Declaration of Independence","The motto of the French Revolution","The Socialist Manifesto of the Russian Revolution","The British Magna Carta"],"answer":"b","explanation":"व्याख्या: प्रस्तािना में शाकमल 'स्वतोंत्रता, समानता और िोंधुत्' का कत्रआयाम किचार फ्ाों स स क्राों कत के ऐकतहाकसक नारे से प्रेररत है । यह किचार भारत य नागररकयों कय गररमापूणव ज िन ज ने और समाज में समरसता िनाए रखने का मागव प्रशस्त करता है ।"},{"id":82,"question":"With reference to Article 368 and the Preamble, which of the following statements is correct?","options":["The Preamble is not considered a part of the Constitution; therefore, it cannot be amended under Article 368.","The Preamble can be amended under Article 368, provided that its Basic Structure is not altered.","By virtue of its complete sovereignty, Parliament can alter or delete any part of the Preamble, including its Basic Structure.","The Preamble has been amended three times so far."],"answer":"b","explanation":"व्याख्या: केशिानोंद भारत मामले (1973) के ऐकतहाकसक फैसले के िाद यह स्थाकपत हय गया कक चूोंकक प्रस्तािना सोंकिधान का अोंग है , इसकलए सोंसद कय अनुच्छेद 368 के तहत इसमें सोंशयधन करने का अकधकार है । हालाों कक, न्यायालय ने 'मूल सोंरचना' का कसद्ाों त कदया, कजसके अनुसार प्रस्तािना के उन िुकनयाद तत्यों कय नह ों िदला जा सकता जय सोंकिधान क आत्मा हैं । इकतहास में अि तक प्रस्तािना कय केिल एक िार (42िें सोंशयधन, 1976 द्वारा) सोंशयकधत ककया गया है ।"},{"id":83,"question":"With reference to the Regulating Act, 1773, consider the following statements: (1) It made the Governors of Bombay and Madras completely subordinate to the Governor-General of Bengal, thereby completing the process of full administrative centralisation in India. (2) Under this Act, the Supreme Court established at Calcutta had jurisdiction over both British subjects and the Company’s servants in Bengal. Which of the above statements is/are correct?","options":["1 only","2 only","1 and 2 both","Neither 1 nor 2"],"answer":"b","explanation":"व्याख्या: रे गुलेकटों ग एि, 1773 किकटश सोंसद द्वारा ईस्ट इों कडया कोंपन के राजन कतक मामलयों कय किकनयकमत करने का पहला िडा कदम था। इसने िॉम्बे और मद्रास के गिनवरयों कय िोंगाल के गिनवर -जनरल के अध न करके केंद्र करण क शुरुआत क थ , न कक इसे पूणव ककया था (प्रशासकनक केंद्र करण पूणव रूप से 1833 के चाटव र एि द्वारा हुआ था)। अतः कथन 1 गलत है । इस अकधकनयम के तहत 1774 में कलकत्ता में एक सिोच्च न्यायालय क स्थापना क गई, कजसमें एक मुख्य न्यायाध श और त न सहायक न्यायाध श थे। इस न्यायालय के पास िोंगाल में किकटश प्रजा और कोंपन के अकधकाररययों दयनयों पर क्षेत्राकधकार था ताकक भ्रष्टाचार कय कनयोंकत्रत ककया जा सके। इसकलए कथन 2 किल्कुल सह है ।"},{"id":84,"question":"Consider the following pairs of British Acts and their major provisions: (1) Pitt’s India Act, 1784 : Establishment of the Board of Control (2) Charter Act, 1813 : Ended the Company’s monopoly except in the trade of tea and with China (3) Charter Act, 1833 : Actual introduction of open competitive examination for recruitment to the Civil Services (4) Indian Councils Act, 1861 : Introduction of the Portfolio System How many of the above pairs are correctly matched?","options":["Only one pair","Only two pairs","Only three pairs","All four pairs"],"answer":"c","explanation":"व्याख्या: युग्म 1 सह सुमेकलत है क्योंकक कपट् स इों कडया एि, 1784 ने नागररक, सैन्य और राजस्व मामलयों क दे खरे ख के कलए 6-सदस्य य 'ियडव ऑफ कोंटर यल' क स्थापना क थ । युग्म 2 भ सह है क्योंकक 1813 के अकधकनयम ने कोंपन के व्यापाररक एकाकधकार कय समाप्त कर कदया, लेककन चाय और च न के साथ व्यापार पर एकाकधकार िनाए रखा। युग्म 4 भ सह है क्योंकक 1861 के अकधकनयम ने िायसराय क पररषद में किभाग य (पयटव फयकलयय) प्रणाल कय िैधाकनक मान्यता द । हालाों कक, युग्म 3 गलत है क्योंकक 1833 के अकधकनयम ने खुल प्रकतययकगता का केिल कसद्ाों त पेश करने का प्रयास ककया था, लेककन इसक िास्तकिक और सफल शुरुआत ययग्यता के आधार पर चाटव र अकधकनयम, 1853 के माध्यम से हुई थ । अतः केिल त न युग्म सह हैं ।"},{"id":85,"question":"With reference to the provisions of the Indian Councils Act, 1861, consider the following statements: (1) It empowered the Viceroy to issue Ordinances during an emergency without the concurrence of the Legislative Council. (2) It initiated the process of decentralisation by restoring legislative powers to the Presidencies of Madras and Bombay. (3) It introduced the system of Dyarchy at the provincial level for the first time. Which of the above statements are correct?","options":["1 and 3 only","2 and 3 only","1 and 2 only","1, 2 and 3"],"answer":"c","explanation":"व्याख्या: भारत य पररषद अकधकनयम, 1861 भारत के सोंिैधाकनक किकास में एक युगाों तकार मयड था। इसके द्वारा िायसराय कय सोंकटकाल में किना पररषद के अनुमयदन के अध्यादे श जार करने का किशेषाकधकार कदया गया, कजसक अिकध छह मह ने थ (कथन 1 सह है )। साथ ह , इसने 1833 द्वारा छ न गई िॉम्बे और मद्रास क किधाय शख्यक्तययों कय िहाल कर किकेंद्र करण क न ि ों रख (कथन 2 सह है )। परों तु, कथन 3 पूर तरह गलत है क्योंकक प्राों तयों में 'द्वै ध शासन' क शुरुआत िहुत िाद में भारत सरकार अकधकनयम, 1919 द्वारा क गई थ , न कक 1861 में। अतः सह किकल्प (c) है ।"},{"id":86,"question":"With reference to the far-reaching changes introduced by the Charter Act, 1833, consider the following statements: (1) It changed the designation of the GovernorGeneral of Bengal to the Governor-General of India, and Lord William Bentinck became the first to hold this office. (2) It completely abolished the legislative powers of the Bombay and Madras Presidencies. (3) It extended the commercial activities of the East India Company for another twenty years, thereby strengthening its commercial character. Which of the above statements are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"a","explanation":"व्याख्या: कथन 3 गलत है क्योंकक 1833 के चाटव र अकधकनयम ने ईस्ट इों कडया कोंपन क व्यापाररक गकतकिकधययों कय पूर तरह समाप्त कर कदया था और उसे एक शुद् प्रशासकनक कनकाय में िदल कदया था। कथन 1 और 2 किल्कुल सह हैं क्योंकक इस अकधकनयम ने भारत में किधाय शख्यक्तययों का पूणव केंद्र करण ककया, िॉम्बे-मद्रास से कानून िनाने का अकधकार छ न कलया और पूरे भारत के कलए नागररक, सैन्य और राजस्व शख्यक्तययों से सोंपन्न 'भारत का गिनवर-जनरल' पद सृकजत ककया।"},{"id":87,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R): Assertion (A): The Charter Act, 1853 is regarded as laying the foundation of the parliamentary form of government in India. Reason (R): For the first time, this Act separated the legislative and executive functions of the GovernorGeneral’s Council and created a Legislative Council of six additional members, which functioned like a miniature Parliament. Choose the correct answer using the code given below:","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"a","explanation":"व्याख्या: चाटव र अकधकनयम, 1853 किकटश ईस्ट इों कडया कोंपन के शासनकाल का अोंकतम चाटव र अकधकनयम था। इस अकधकनयम ने भारत य सोंिैधाकनक इकतहास में एक िडा म ल का पत्थर स्थाकपत ककया क्योंकक इसने पहल िार गिनवर-जनरल क पररषद के कानून िनाने के कायव (किधाय ) कय प्रशासकनक कायों (कायवकार ) से अलग कर कदया। इसके कलए पररषद में 6 नए सदस्य जयडे गए कजन्हें 'किधाय पररषद' कहा गया। इस नई किधाय पररषद ने किकटश सोंसद क प्रकक्रयाओों कय अपनाते हुए एक 'लघु-सोंसद' के रूप में कायव करना शुरू ककया। अतः कथन (A) और कारण (R) दयनयों सत्य हैं और कारण, कथन क किल्कुल सह व्याख्या करता है ।"},{"id":88,"question":"Which was the first British Act under which the administration of Indian affairs was placed directly under a member of the British Cabinet, who was vested with full administrative powers at the Secretariat level?","options":["Pitt’s India Act, 1784","Charter Act, 1833","Government of India Act, 1858","Indian Councils Act, 1861"],"answer":"c","explanation":"व्याख्या: 1857 के किद्रयह (कसपाह किद्रयह) के िाद, किकटश सोंसद ने भारत में ईस्ट इों कडया कोंपन के शासन कय समाप्त करने के कलए 'भारत सरकार अकधकनयम, 1858' पाररत ककया। इस अकधकनयम के द्वारा शासन क कमान स धे किकटश क्राउन (महारान ) के हाथयों में सौोंप द गई। इस व्यिस्था के अोंतगवत पूिविती 'ियडव ऑफ कोंटर यल' और 'कयटव ऑफ डायरे िसव' कय पूर तरह समाप्त कर कदया गया और उनके स्थान पर किकटश कैकिनेट के एक सदस्य कय 'भारत का राज्य सकचि' कनयुक्त ककया गया। इस नए पद कय भारत य प्रशासन पर पूणव कनयोंत्रण और अकधकार प्राप्त था, कजसक सहायता के कलए 15-सदस्य य भारत पररषद का गठन ककया गया था।"},{"id":89,"question":"An Indian citizen shall lose his/her citizenship if he/ she: (1) Renounces Indian citizenship. (2) Voluntarily acquires the citizenship of another country. (3) Marries a citizen of another country. (4) Criticises the Government. Choose the correct answer using the code given below: Code:","options":["1, 2 and 3","2, 3 and 4","1 and 2 only","1 and 4 only"],"answer":"c","explanation":"व्याख्या: भारत य सोंकिधान के अनुच्छेद 5 से 11 तथा नागररकता अकधकनयम, 1955 के अनुसार भारत य नागररकता समाप्त हयने के प्रमुख आधार हैं —(1) नागररकता का पररत्याग तथा (2) स्वेच्छा से ककस अन्य दे श क नागररकता प्राप्त करना। यकद कयई भारत य नागररक अपन इच्छा से भारत य नागररकता त्याग दे ता है या स्वेच्छा से ककस अन्य दे श क नागररकता ग्रहण कर लेता है , तय िह भारत य नागररकता खय दे ता है । इसके किपर त, ककस अन्य दे श के नागररक से कििाह करने मात्र से भारत य नागररकता समाप्त नह ों हयत , क्योंकक भारत य कानून कििाह कय नागररकता समाप्त हयने का आधार नह ों मानता। इस प्रकार सरकार क आलयचना करना भ नागररकता समाप्त हयने का आधार नह ों है , क्योंकक भारत में प्रत्येक नागररक कय सोंकिधान के अनुच्छेद 19(1)(a) के तहत अकभव्यख्यक्त क स्वतोंत्रता का अकधकार प्राप्त है (यद्यकप यह युख्यक्तसोंगत प्रकतिोंधयों के अध न है )। इसकलए केिल कथन 1 और 2 सह हैं , जिकक 3 और 4 गलत हैं । अतः सह उत्तर (c) केिल 1 और 2 है ।"},{"id":90,"question":"With reference to the nature of the Indian State, what does the Indian version of the term “Socialist” imply?","options":["Complete nationalisation of all means of production and distribution and abolition of private property.","A system in which the private sector is completely prohibited.","Achieving socialist goals through democratic means, with the coexistence of both the public and private sectors.","Establishment of a communist system of government with complete State control."],"answer":"c","explanation":"व्याख्या: प्रस्तािना में प्रयुक्त 'समाजिाद ' शब्द का भारत य सोंदभव पकिम या साम्यिाद समाजिाद से कभन्न है । भारत य समाजिाद 'लयकताों कत्रक समाजिाद' है जय लयकताों कत्रक साधनयों के माध्यम से समाजिाद उद्दे श्ययों कय प्राप्त करने में किश्वास रखता है । यह एक 'कमकश्रत अथवव्यिस्था' पर आधाररत है , जहाों दे श के किकास के कलए कनज और सािवजकनक दयनयों क्षेत्र कोंधे से कोंधा कमलाकर, एक साथ सह-अख्यस्तत् में काम करते हैं । इसका उद्दे श्य ककस का उन्मूलन करना नह ,ों िख्यल्क जनकल्याण सुकनकित करना है।"},{"id":91,"question":"With reference to the Fundamental Rights, consider the following statements: (1) The original Constitution included the Right to Property (Article 31), which was removed from the list of Fundamental Rights by the 44th Constitutional Amendment Act, 1978. (2) The Right to Property is presently a legal right under Article 300A in Part XII of the Constitution. Which of the above statements is/are correct?","options":["1 only","2 only","1 and 2 both","Neither 1 nor 2"],"answer":"c","explanation":"व्याख्या: दयनयों कथन किल्कुल सह हैं । भारत य सोंकिधान में मूल रूप से सात मौकलक अकधकार थे , कजनमें सोंपकत्त का अकधकार (अनुच्छेद 31) भ शाकमल था। हालाोंकक, इसे 44िें सोंकिधान सोंशयधन अकधकनयम, 1978 द्वारा मौकलक अकधकारयों क सूच से हटा कदया गया था। इस सोंशयधन के िाद, इसे सोंकिधान के भाग XII (Part XII) में अनुच्छेद 300-A के तहत एक सामान्य कानून अकधकार िना कदया गया। अतः किकल्प (c) सह उत्तर है ।"},{"id":92,"question":"Consider the following pairs: Fundamental Right Related Articles 1. Right to Equality Articles 14–18 2. Cultural and Educational Rights Articles 25–28 3. Right against Exploitation Articles 23–24 How many of the above pairs are correctly matched?","options":["Only one pair","Only two pairs","All three pairs","None of the pairs"],"answer":"b","explanation":"व्याख्या: भारत य सोंकिधान नागररकयों कय छह मूल अकधकार प्रदान करता है । समता का अकधकार अनुच्छेद 14 से 18 तक किस्तृत है , इसकलए युग्म 1 सह सुमेकलत है । शयषण के किरुद् अकधकार अनुच्छेद 23 और 24 में िकणवत है , इसकलए युग्म 3 भ सह सुमेकलत है । हालाोंकक, युग्म 2 गलत सुमेकलत है क्योंकक सोंस्कृकत और कशक्षा सोंिोंध अकधकार अनुच्छेद 29-30 के अोंतगवत आते हैं , जिकक अनुच्छेद 25-28 धाकमवक स्वतोंत्रता के अकधकार से सोंिोंकधत हैं । चूोंकक केिल दय युग्म (1 और 3) सह हैं , इसकलए सह किकल्प (b) है ।"},{"id":93,"question":"A foreign national, who is in India on a valid business visit, claims that the local police have detained him without any valid grounds and are not allowing him to consult a legal practitioner of his choice. Under Part III of the Constitution, which of the following protections can the foreign national claim? (1) Protection against discrimination under Article 15. (2) Protection of life and personal liberty under Article 21. (3) Protection against arrest and detention under Article 22. Choose the correct answer using the code given below:","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्या: सोंकिधान के कुछ मूल अकधकार केिल नागररकयों कय प्राप्त हैं , जिकक कुछ अकधकार नागररकयों और किदे कशययों (शत्रु दे श के नागररकयों कय छयडकर) दयनयों कय प्राप्त हैं । अनुच्छेद 15 (धमव, मूलिोंश, जाकत, कलोंग या जन्मस्थान के आधार पर भेदभाि का कनषेध) केिल भारत य नागररकयों के कलए उपलब्ध है । इसके किपर त, अनुच्छेद 21 (प्राण और दै कहक स्वतोंत्रता का सोंरक्षण) और अनुच्छेद 22 (कगरफ्तार और कनरयध से सोंरक्षण) नागररकयों के साथ-साथ किदे कशययों कय भ प्राप्त हैं । चूोंकक िह व्यख्यक्त एक किदे श नागररक है , िह केिल अनुच्छेद 21 और 22 के तहत अकधकारयों का दािा कर सकता है । इसकलए, किकल्प (b) सह है ।"},{"id":94,"question":"With reference to the power of Parliament to amend the Fundamental Rights, consider the following statements: (1) Article 13 declares that all laws inconsistent with or in derogation of the Fundamental Rights shall be void. (2) According to Article 13, a Constitutional Amendment can never be challenged because it does not fall within the definition of “law.” (3) In the Kesavananda Bharati Case (1973), the Supreme Court held that a Constitutional Amendment can be challenged if it violates the Basic Structure of the Constitution. Which of the above statements are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"c","explanation":"व्याख्या: अनुच्छेद 13 स्पष्ट करता है कक मूल अकधकारयों का उल्लोंघन करने िाले कानून शून्य हयोंगे। यद्यकप अनुच्छेद 13 में यह उल्लेख है कक एक सोंिैधाकनक सोंशयधन कय इस आधार पर चुनौत नह ों द जा सकत कक िह मूल अकधकार कय छ नता है (क्योंकक िह सामान्य किकध नह ों है ), लेककन न्यायपाकलका क सिोच्चता के कारण इस ख्यस्थकत कय िदल कदया गया। केशिानोंद भारत मामले (1973) में सिोच्च न्यायालय ने ऐकतहाकसक कनणवय कदया कक सोंसद क सोंशयधन शख्यक्त अस कमत नह ों है ; यकद कयई सोंशयधन सोंकिधान के 'मूल ढाों चे' (कजसमें कुछ मूल अकधकार भ शाकमल हैं ) का उल्लोंघन करता है , तय उसे अिैध घयकषत ककया जा सकता है । अतः कथन 2 का पूणव रूप से लागू हयना अि मान्य नह ों है और केिल 1 तथा 3 पूर तरह सह हैं ।"},{"id":95,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R): Assertion (A): The Fundamental Rights guaranteed by the Constitution of India are not absolute, but are qualified or subject to reasonable restrictions. Reason (R): The State may impose reasonable restrictions on these rights, and the validity of such restrictions is determined by the courts. Choose the correct answer using the code given below:","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"a","explanation":"व्याख्या: भारत य सोंकिधान द्वारा प्रेकषत मूल अकधकार पूणव या कनरपेक्ष नह ों हैं । नागररकयों कय ये अकधकार कुछ स माओों के साथ कदए गए हैं , कजसका अथव है कक िे ययग्य (Qualified) हैं । राज्य सामाकजक व्यिस्था, सुरक्षा और सािवजकनक कहत में इन अकधकारयों पर 'उकचत प्रकतिोंध' लगा सकता है । सिसे महत्पूणव िात यह है कक राज्य द्वारा लगाया गया प्रकतिोंध ताककवक या उकचत है या नह ,ों इसका अोंकतम कनधाव रण न्यायपाकलका (अदालतयों) द्वारा ककया जाता है । चूोंकक कारण (R) स धे तौर पर यह स्पष्ट करता है कक अकधकार कनरपेक्ष क्यों नह ों हैं , इसकलए कथन और कारण दयनयों सह हैं तथा कारण, कथन क सह व्याख्या करता है ।"},{"id":96,"question":"With reference to the Right to Information (RTI) Act, 2005, consider the following statements: (1) Under the Act, a citizen must provide valid reasons for seeking information from a public authority. (2) Information relating to life and personal liberty must be provided within 48 hours. Which of the above statements is/are correct?","options":["1 only","2 only","1 and 2 both","Neither 1 nor 2"],"answer":"b","explanation":"व्याख्या: कथन 1 गलत है क्योंकक RTI अकधकनयम, 2005 के महत्पूणव प्रािधानयों के तहत भारत का कयई भ नागररक किना ककस कारण कय िताए लयक प्राकधकाररययों से जानकार प्राप्त कर सकता है ; आिेदक के कलए कारण दे ना अकनिायव नह ों है । कथन 2 किल्कुल सह है क्योंकक अकधकनयम में सूचना प्रदान करने के कलए समय-स मा कनधावररत क गई है , कजसके तहत सामान्य मामलयों में 30 कदनयों के भ तर और ज िन तथा स्वतोंत्रता से जुडे अत्योंत सोंिेदनश ल मामलयों में 48 घोंटयों के भ तर सूचना प्रदान करना अकनिायव है । अतः किकल्प (b) सह है ।"},{"id":97,"question":"With reference to the suspension of Fundamental Rights during a National Emergency, consider the following statements: (1) During the operation of a National Emergency, all Fundamental Rights except those guaranteed under Articles 20 and 21 may be suspended. (2) The six Fundamental Rights guaranteed under Article 19 can be suspended only when the Emergency is proclaimed on the grounds of war or external aggression (External Emergency). (3) The rights under Article 19 cannot be suspended when the Emergency is proclaimed on the ground of armed rebellion (Internal Emergency). Which of the above statements are correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":"d","explanation":"व्याख्या: राष्टर य आपातकाल के दौरान मूल अकधकारयों क ख्यस्थकत के सोंिोंध में त नयों कथन पूर तरह सह हैं। आपातकाल के समय भ अनुच्छेद 20 (अपराधयों के कलए दयषकसख्यद् के सोंिोंध में सोंरक्षण) और अनुच्छेद 21 (प्राण और दै कहक स्वतोंत्रता का सोंरक्षण) कय ककस भ ख्यस्थकत में कनलोंकित नह ों ककया जा सकता है । इसके अकतररक्त, अनुच्छेद 19 के तहत कमलने िाल छह स्वतोंत्रताएों केिल िाहर आपातकाल (युद् या किदे श आक्रमण) के दौरान ह स्थकगत क जा सकत हैं । यकद आपातकाल आों तररक अशाों कत या सशि किद्रयह के आधार पर लगाया गया है , तय अनुच्छेद 19 कनलोंकित नह ों हयता है ।"},{"id":98,"question":"Arrange the following events related to the constitutional history of India and the evolution of Fundamental Rights in the correct chronological order, beginning with the earliest: (1) Issue of the Magna Carta by King John of England. (2) Landmark judgment of the Supreme Court in the Kesavananda Bharati Case. (3) Removal of the Right to Property by the 44th Constitutional Amendment Act. (4) Insertion of the Right to Education (Article 21A) by the 86th Constitutional Amendment Act. Choose the correct answer using the code given below:","options":["1–2–3–4","1–3–2–4","2–1–3–4","1–2–4–3"],"answer":"a","explanation":"व्याख्या: सोंिैधाकनक घटनाओों का िषव इस प्रकार है : 1. 'मैग्ना काटाव ' क घयषणा - िषव 1215 में ककोंग जॉन द्वारा क गई थ । 2. केशिानोंद भारत मामला - इस मामले में सिोच्च न्यायालय का कनणवय िषव 1973 में आया था। 3. 44िााँ सोंकिधान सोंशयधन अकधकनयम - यह अकधकनयम िषव 1978 में पाररत हुआ था, कजसके द्वारा सोंपकत्त के अकधकार कय हटाया गया। 4. 86िााँ सोंकिधान सोंशयधन अकधकनयम - यह िषव 2002 में हुआ, कजसने अनुच्छेद 21-A जयडकर कशक्षा कय मूल अकधकार िनाया। अतः इनका सह कालानुक्रकमक क्रम 1-2-3-4 है , जय किकल्प (a) में कदया गया है ।"},{"id":99,"question":"With reference to the provisions relating to the Abolition of Titles under Article 18, consider the following statements: (1) It prohibits the State from conferring any title on any citizen or foreigner, except military or academic distinctions. (2) Any citizen of India may accept any title from a foreign State if he/she does not hold any office under the Government. (3) No foreign national holding any office of profit or trust under the State shall accept any title from any foreign State without the consent of the President. How many of the above statements are incorrect?","options":["Only one statement","Only two statements","All three statements","None of the statements"],"answer":"a","explanation":"व्याख्या: अनुच्छेद 18 उपाकधययों का कनषेध करता है । कथन 1 सह है क्योंकक राज्य केिल सेना और कशक्षा सोंिोंध सम्मान ह दे सकता है , अन्य कयई उपाकध नह ।ों कथन 3 भ सह है क्योंकक लाभ के पद पर आस न कयई किदे श व्यख्यक्त राष्टरपकत क सहमकत के किना किदे श उपाकध नह ों ले सकता। हालाों कक, कथन 2 गलत है क्योंकक भारत का कयई भ नागररक ककस भ किदे श राज्य से ककस भ प्रकार क उपाकध स्व कार नह ों कर सकता है ; इसमें सरकार पद पर हयने या न हयने क कयई छूट नह ों द गई है । चूोंकक केिल एक कथन (कथन 2) गलत है , इसकलए उत्तर किकल्प (a) हयगा।"},{"id":100,"question":"With reference to the Right to Constitutional Remedies and writ jurisdiction, consider the following inferences: (1) Although any person may directly approach the Supreme Court for the enforcement of Fundamental Rights, the High Courts also possess concurrent power to enforce these rights. (2) The power of judicial review and issuance of writs is vested only in the Supreme Court. Which of the above statements is/are correct?","options":["1 only","2 only","1 and 2 both","Neither 1 nor 2"],"answer":"a","explanation":"व्याख्या: अनुच्छेद 13 और ररट क्षेत्राकधकार के तहत मूल अकधकारयों के उल्लोंघन के किरुद् उपचार प्रदान करने क शख्यक्त सिोच्च न्यायालय (अनुच्छेद 32) और उच्च न्यायालययों (अनुच्छेद 226) दयनयों कय द गई है । प कडत व्यख्यक्त स धे सिोच्च न्यायालय जा सकता है , जय यह दशाव ता है कक मूल अकधकार स धे प्रितवन य हैं , और उच्च न्यायालय के पास भ यह शख्यक्त हयने के कारण यह एक समिती अकधकार क्षेत्र िनता है । इसकलए कथन 1 सह है। कथन 2 पूर तरह गलत है क्योंकक ररट जार करने क शख्यक्त केिल सिोच्च न्यायालय तक स कमत नह ों है , िख्यल्क उच्च न्यायालययों कय भ प्राप्त है । अतः किकल्प (a) सह उत्तर है ।"},{"id":101,"question":"Consider the following statements regarding the paddy procurement system in Uttar Pradesh: (1) Paddy procurement in Western Uttar Pradesh will take place from October 1, 2025 to January 31, 2026. (2) Paddy procurement in Eastern Uttar Pradesh will run from November 1, 2025 to February 28, 2026. (3) The Minimum Support Price (MSP) for paddy (common) is ₹2,389 per quintal. (4) Registration of farmers is mandatory for selling paddy. Which of the above statements is/are correct?","options":["1, 2 and 4","1 and 3","2 and 3","1, 2, 3 and 4"],"answer":"a","explanation":"व्याख्या: पकिम और पूिी उत्तर प्रदे श में धान खर द क कतकथयााँ क्रमशः 1 अिू िर–31 जनिर तथा 1 निोंिर–28 फरिर कनधाव ररत हैं । ककसानयों का पोंज करण 1 कसतोंिर 2025 से अकनिायव ककया गया है । धान (सामान्य) का MSP ₹2,369 प्रकत ख्यवोंटल है , जिकक ₹2,389 ग्रेड-A के कलए है , इसकलए कथन 3 गलत है ।"},{"id":102,"question":"Which of the following statements is correct with reference to the CAG’s “Decadal Report on the Economic Performance of States”?","options":["In the financial year 2023, Uttar Pradesh ranked first in the country with a revenue surplus of ₹37,000 crore.","Uttar Pradesh’s GSDP decreased from ₹13.6 lakh crore between 2017-18 and 2025-26.","All states recorded a revenue surplus in the year 2022-23.","Gujarat and Odisha are among the states with a revenue deficit."],"answer":"a","explanation":"व्याख्या: CAG ररपयटव के अनुसार कित्त य िषव 2023 में उत्तर प्रदे श ₹37,000 करयड के राजस्व अकधशेष के साथ दे श में श षव पर रहा। राज्य का GSDP िषव 2017-18 में ₹13.6 लाख करयड से िढकर 2025-26 में अनुमाकनत ₹30 लाख करयड हय गया। िषव 2022-23 में केिल 16 राज्ययों ने अकधशेष दजव ककया, जिकक 12 राज्ययों में घाटा रहा। गुजरात और ओकडशा अकधशेष राज्ययों में शाकमल हैं ।"},{"id":103,"question":"Consider the following statements regarding India’s first comprehensive Animal Birth Control (ABC) training center: (1) This training center will be established in Jarhara, Lucknow, in collaboration with the private sector. (2) This center will provide training only related to animal surgery. (3) Legal compliance training in accordance with the Animal Birth Control Rules, 2023 will be a part of this center. (4) In August 2025, the Supreme Court considered ABC programs as a key strategy for managing stray dogs. How many of the above statements are incorrect?","options":["Only one","Only two","Only three","All four"],"answer":"b","explanation":"व्याख्या: कथन 1 गलत है क्योंकक यह केंद्र लखनऊ नगर कनगम और Humane World for Animals India के ि च MoU के तहत एक सािवजकनक प्रकशक्षण केंद्र के रूप में स्थाकपत ककया जाएगा, न कक केिल कनज क्षेत्र द्वारा। कथन 2 भ गलत है क्योंकक प्रकशक्षण केिल शल्यकक्रया तक स कमत नह ों हयगा, िख्यल्क इसमें कुत्तयों कय पकडने क तकन क, प्र -ऑपरे कटि जाों च, केनल प्रिोंधन, डे टा ररकॉकडिं ग, समुदाय सहभाकगता आकद शाकमल हैं । कथन 3 सह है क्योंकक प्रकशक्षण में पशु जन्म कनयोंत्रण कनयम, 2023 के अनुरूप कानून प्रकक्रयाएाँ शाकमल हयोंग । कथन 4 भ सह है क्योंकक अगस्त 2025 में सिोच्च न्यायालय ने ABC कायवक्रमयों कय आिारा कुत्तयों के प्रिोंधन क समग्र रणन कत का प्रमुख कहस्सा माना है ।"},{"id":104,"question":"Over 20 years of Global Hunger Index tracking, what is the clearest lesson about progress toward zero hunger? (1) Progress is possible but uneven, fragile, and reversible (2) Economic growth alone automatically ends hunger for all (3) Technological innovation has eliminated most food insecurity (4) Hunger trends are purely driven by natural disasters?","options":["Only one","Only two","Only three","All four"],"answer":"a","explanation":"व्याख्या: िैकश्वक भूख सूचकाों क (GHI) क ररपयकटिं ग के दय दशकयों से अकधक के आों कडयों से पता चलता है कक कई दे शयों ने भूख स्कयर कय कम ककया है , कफर भ अन्य दे शयों में ठहराि या किगडाि हुआ है , खासकर सोंघषव, जलिायु झटकयों और आकथवक सोंकटयों के सोंदभों में। लाभ युद्, महामाररययों या मूल्य िृख्यद् से जल्द ह उलट सकते हैं , जय साकित करता है कक प्रगकत नाजुक है । कुछ क्षेत्रयों में लगातार सुधार हयता है , जिकक अन्य प छे रह जाते हैं , जय दशाव ता है कक सफलता समािेश न कतययों, लच ले खाद्य प्रणाकलययों, सामाकजक सुरक्षा और शाोंकत पर गहराई से कनभवर करत है। GHI इस प्रकार जयर दे ता है कक यकद दु कनया कय कटकाऊ किकास लक्ष्य के तहत शून्य भूख क कदशा में किश्वसन य रूप से आगे िढना है , तय राष्टर य आय में िृख्यद् के अलािा जानिूझकर, कनरों तर और समान प्रयासयों क आिश्यकता है ।"},{"id":105,"question":"Consider the following statements regarding International Abhidhamma Day 2025: (1) International Abhidhamma Day was organized by the Ministry of Culture, Government of India, in collaboration with the International Buddhist Confederation (IBC). (2) The relevance of Abhidhamma philosophy was discussed during this event, but no themebased exhibition was organized. (3) Abhidhamma is the second part of the Buddhist Tripitaka and focuses primarily on ritualistic traditions. (4) The Government of India has granted the status of ‘Classical Language’ to the Pali language. How many of the above statements are incorrect?","options":["Only one","Only two","Only three","All four"],"answer":"b","explanation":"व्याख्या: कमशन शख्यक्त–5.0 का उद्दे श्य केिल मकहला सुरक्षा नह ,ों िख्यल्क सामाकजक, आकथवक और शैकक्षक सशख्यक्तकरण भ है , इसकलए कथन 3 गलत है । राज्य में 1,647 पुकलस थानयों में कमशन शख्यक्त केंद्र स्थाकपत ककए गए हैं , कजससे कथन 1 सह है । 1090 िूमेन पािर हेल्पलाइन पर दजव लगभग सभ कशकायतयों का कनस्तारण ककया गया, अतः कथन 2 सह है । राज्य ग्राम ण आज किका कमशन के अोंतगवत 2 लाख से अकधक मकहलाओों कय ‘लखपकत द द ’ के रूप में मान्यता द गई है , इसकलए कथन 4 भ सह है ।"},{"id":106,"question":"Consider the following statements regarding Mission Shakti-5.0: (1) Under Mission Shakti-5.0, Mission Shakti Centers have been established in all 1,647 police stations of Uttar Pradesh. (2) Almost all complaints registered on the 1090 Women Power Helpline between January 2024 and August 2025 have been resolved. (3) Mission Shakti-5.0 is limited only to women’s safety and has no connection with economic empowerment. (4) More than 2 lakh women have been identified as ‘Lakhpati Didis’ under the State Rural Livelihoods Mission. Which of the above statements are correct?","options":["Only 1 and 2","Only 1, 2 and 4","Only 2 and 3","1, 2, 3 and 4"],"answer":"a","explanation":"व्याख्या: कथन 2 सह है क्योंकक उत्तर प्रदे श सरकार द्वारा इन्वेस्ट यूप के पुनगवठन कय मोंजूर द गई है , कजसका उद्दे श्य राज्य कय एक प्रमुख औद्ययकगक और कनिेश गोंतव्य िनाना है । पुनगवठन के तहत िि, ऑटयमयिाइल एिों इलेख्यिरक मयकिकलट , रसायन, इलेिरॉकनक्स और सेिाओों जैसे रणन कतक क्षेत्रयों के कलए क्षेत्र-किकशष्ट किशेषज्ञ प्रकयष्ठ स्थाकपत ककए जाएों गे। ये प्रकयष्ठ कनिेशकयों कय न कतगत सहययग, तकन क किशेषज्ञता और प्रभाि समन्वय प्रदान करें गे, कजससे कनिेश कायाव न्वयन क दक्षता िढे ग । कथन 2 गलत है क्योंकक सैटेलाइट कनिेश प्रयत्साहन कायाव लय उत्तर प्रदे श के भ तर नह ,ों िख्यल्क मुोंिई, िेंगलुरु, है दरािाद, चेन्नई और नई कदल्ल जैसे दे श के प्रमुख महानगरयों में स्थाकपत ककए जाएों गे। इन कायाव लययों का उद्दे श्य राज्य सरकार और घरे लू एिों िैकश्वक कनिेशकयों के ि च स धा सोंपकव स्थाकपत करना है ।"},{"id":107,"question":"Consider the following statements in the context of the recent restructuring of Invest UP: Statement 1: Under the restructuring, Invest UP will establish expert cells for strategic industrial sectors such as textiles, automobiles and electric mobility, chemicals, electronics, and services. Statement 2: To enhance investor outreach, Invest UP’s satellite investment promotion offices will be established only in major industrial cities within Uttar Pradesh. Which of the above statements is/are correct?","options":["Only statement 1","Only statement 2","Both statements 1 and 2","Neither statement 1 nor statement 2"],"answer":"a","explanation":"व्याख्या: कथन 1 सह है क्योंकक उत्तर प्रदे श सरकार राज्य में एक कडकजटल कृकष पाररख्यस्थकतक तोंत्र किककसत करने जा रह है , कजसके अोंतगवत फसल, मौसम, ि ज, कसोंचाई, उिवरक, ि मा, िाजार, लॉकजख्यस्टक्स और सोंस्थागत सेिाओों से जुडे डे टा तक र यल-टाइम और एक कृत कडकजटल पहुाँ च प्रदान क जाएग । यह न कत राष्टर य तकन क मानकयों पर आधाररत हयग और सुरकक्षत साइिर अिसोंरचना पर िल दे ग । कथन 2 गलत है क्योंकक यूप -एग्र स (UP-AGREES) पररययजना किश्व िैंक द्वारा कित्त पयकषत है , कजसमें भारत सरकार या राज्य सरकार का भ ययगदान है , लेककन पररययजना का िडा कहस्सा किश्व िैंक के ऋण के रूप में आया है , न कक 'पूणवतः भारत सरकार द्वारा। इसक अिकध लगभग 6 िषव और िजट लगभग ₹4,000 करयड है । साथ ह यह पररययजना पूिी उत्तर प्रदे श के 21 कजलयों और िुोंदेलखोंड के 7 कजलयों में लागू क जा रह है , न कक केिल पकिम उत्तर प्रदे श में।"},{"id":108,"question":"Consider the following statements with reference to the Uttar Pradesh Digital Agriculture Policy and the UP-AGREES project: (1) The Uttar Pradesh Digital Agriculture Policy proposes to provide real-time integrated digital access to data related to crops, weather, seeds, irrigation, fertilizers, insurance, markets, and logistics. (2) The UP-AGREES project is fully funded by the Government of India and is being implemented only in the districts of Western Uttar Pradesh. Which of the statements given above is/are correct?","options":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"answer":"a","explanation":"व्याख्या: यूप उडान पयटव ल उत्तर प्रदे श सरकार द्वारा डर यन सोंचालन कय सुरकक्षत और पारदशी िनाने हे तु शुरू ककया गया है । यह डर यन क खर द से लेकर सोंचालन और कनगरान तक सभ प्रकक्रयाओों कय एक कृत रूप से कनयोंकत्रत करता है , इसकलए कथन 1 सह है । यह पयटव ल “डर यन सोंचालन सुरक्षा न कत–2023” के अोंतगवत किककसत ककया गया है , अतः कथन 3 भ सह है । किना पोंज करण डर यन उडाने पर पूणव प्रकतिोंध है , इसकलए कथन 2 गलत है । पायलट प्रयजेि के रूप में इसे कई शहरयों जैसे गयरखपुर, अययध्या, िाराणस , आगरा आकद में लागू ककया गया है , न कक केिल लखनऊ और कानपुर में , इसकलए कथन 4 भ गलत है ।"},{"id":109,"question":"Consider the following statements regarding the “UP UDAAN (Uttar Pradesh Unified Drone Application and Authorization Network)” portal recently launched by the Uttar Pradesh government: (1) The UP UDAAN portal comprehensively controls the purchase, permission, operation, and monitoring of drones. (2) Drone operation without registration is permitted under the UP UDAAN policy. (3) This portal has been developed under the “Drone Operation Safety Policy – ​2023”. (4) As a pilot project, it has been implemented only in Lucknow and Kanpur. Which of the above statements is/are correct?","options":["Only 1 and 3","Only 1, 2 and 3","Only 1, 3 and 4","Only 1 and 4"],"answer":"c","explanation":"व्याख्या: भारत के मुख्य न्यायाध श ि . आर. गिई क अध्यक्षता िाल पााँ च न्यायाध शयों क सोंकिधान प ठ ने कजला न्यायाध शयों क कनयुख्यक्त से सोंिोंकधत एक महत्पूणव व्याख्या द है । सोंकिधान के अनुच्छेद 233(2) के अनुसार, ऐसे अकधिक्ता जय कम से कम सात िषों तक िार में सकक्रय अभ्यास कर चुके हयों, कजला न्यायाध श पद के कलए पात्र हयते हैं । हाकलया कनणवय में सिोच्च न्यायालय ने स्पष्ट ककया कक यकद कयई व्यख्यक्त पहले िार में 7 िषों का अनुभि प्राप्त कर चुका है और िाद में अध नस्थ न्याकयक सेिा में भती हुआ है , तय िह भ कजला न्यायाध श या अकतररक्त कजला न्यायाध श पद पर कनयुख्यक्त के कलए ययग्य हयगा। इस कनणवय के माध्यम से न्यायालय ने रामेश्वर दयाल िनाम पोंजाि राज्य (1960) और चोंद्र मयहन िनाम उत्तर प्रदे श राज्य (1966) के पुराने कनणवययों पर पुनकिवचार ककया। साथ ह , यह भ कनदे श कदया गया कक आिेदन क कतकथ पर उम्म दिार क न्यूनतम आयु 35 िषव हयन चाकहए तथा राज्य सरकारें उच्च न्यायालययों से परामशव लेकर कनयुख्यक्त प्रकक्रया करें ।"},{"id":110,"question":"Which constitutional provision did the Supreme Court of India recently interpret to clarify that judicial officers from the subordinate judicial service would also be eligible for the post of District Judge, provided they have 7 years of experience at the Bar?","options":["Article 124","Article 217","Article 233(2)","Article 235"],"answer":"c","explanation":"व्याख्या: ग्लयिल कफनटे क फेस्ट 2025 का छठा सोंस्करण मुोंिई में आययकजत ककया गया, कजसने कडकजटल कित्त के क्षेत्र में भारत क िैकश्वक नेतृत्कार भूकमका कय उजागर ककया। इस आययजन का नेतृत् भारत य भुगतान पररषद (PCI), भारत य राष्टर य भुगतान कनगम (NPCI) और कफनटे क कन्वजेस काउों कसल (FCC) ने ककया। कायवक्रम कय इलेिरॉकनक्स और सूचना प्रौद्ययकगक मोंत्रालय, कित्त मोंत्रालय, DPIIT, RBI, IFSCA और इन्वेस्ट इों कडया का समथवन प्राप्त था। िषव 2025 क थ म थ — “िेहतर किश्व के कलए कित्त कय सशक्त िनाना – AI द्वारा सोंचाकलत: सोंिकधवत िुख्यद्मत्ता, निाचार, समािेशन”। इस िैकश्वक आययजन में 75 दे शयों के 1 लाख से अकधक प्रकतभाकगययों, 7,500 कोंपकनययों, 800 िक्ताओों, 400 प्रदशवकयों तथा 70 कनयामकयों ने भाग कलया, कजनमें कई दे शयों के केंद्र य िैंक भ शाकमल थे।"},{"id":111,"question":"Which of the following statements is correct with respect to the Global Fintech Fest 2025?","options":["It was organized in New Delhi by the RBI.","The theme for 2025 was “Digital Payments and Cybersecurity”.","It was organized in Mumbai by PCI, NPCI, and the Fintech Convergence Council.","Only representatives from Asian countries participated in it."],"answer":"c","explanation":"व्याख्या: राष्टर य ऊाँट ख्यस्थरता पहल (NCSI) एक प्रस्ताकित राष्टर य कमशन है , कजसे मत्स्यपालन, पशुपालन और डे यर मोंत्रालय द्वारा शुरू ककया जाना है । इसका मुख्य उद्दे श्य भारत में ऊाँटयों क सोंख्या में हय रह कनरों तर कगरािट कय रयकना है । िषव 1977 से अि तक ऊाँटयों क आिाद में लगभग 75% क कगरािट दजव क गई है । 20ि ों पशुधन जनगणना (2019) के अनुसार भारत में ऊाँटयों क सोंख्या केिल 2.52 लाख रह गई है , जिकक 1977 में यह लगभग 11 लाख थ । यह ययजना पशुपालन एिों डे यर किभाग के साथ-साथ पयाव िरण, ग्राम ण किकास, पयवटन मोंत्रालय और राज्य सरकारयों के सहययग से लागू क जाएग । भारत में लगभग 90% ऊाँट राजस्थान और गुजरात में पाए जाते हैं । इसके अलािा, किश्व ऊाँट कदिस 22 जून कय मनाया जाता है ।"},{"id":112,"question":"Which of the following statements is correct regarding the National Camel Sustainability Initiative (NCSI)?","options":["Its objective is to promote camel milk production.","It will be implemented only by the Government of Rajasthan.","Its objective is to prevent the declining number of camels in India.","This scheme is related only to the Ministry of Tourism."],"answer":"b","explanation":"व्याख्या: इलेिरॉकनक िैंक गारों ट (e-BG) पहल का उद्दे श्य भारत में िैंक गारों ट जै से महत्पूणव कित्त य दस्तािेजयों कय पूर तरह कडकजटल, कागज़ रकहत और सुरकक्षत िनाना है । इस कदशा में इलेिरॉकनक्स और सूचना प्रौद्ययकगक मोंत्रालय (MeitY) के अोंतगवत राष्टर य ई-गिनेस कडि जन (NeGD) और राष्टर य ई-गिनेस सकिवसेज कलकमटे ड (NeSL) के ि च एक समझौता ज्ञापन (MoU) पर हस्ताक्षर ककए गए हैं । इसके तहत NeGD के क्लाउड-आधाररत एों कटट लॉकर प्लेटफ़ॉमव कय NeSL के कडकजटल दस्तािेज कनष्पादन (DDE) प्लेटफ़ॉमव के साथ एक कृत ककया गया है । यह एक करण कडकजलॉकर पहल का किस्तार है और इससे कानून रूप से िाध्यकार अनुिोंधयों, किशेषकर e-BG, का कनिाव ध, तेज और पारदशी कनष्पादन सोंभि हयगा। यह पहल कदिाला एिों शयधन अक्षमता सोंकहता, 2016 (IBC) और अन्य गयपन यता कनयमयों के अनुरूप है , कजससे लेनदे न कानून रूप से सुरकक्षत रहते हैं ।"},{"id":113,"question":"What is the main objective of the Electronic Bank Guarantee (e-BG) initiative, which has been in the news recently?","options":["To allow foreign banks to enter India","To ensure paperless, secure, and legally valid digital execution of financial documents such as bank guarantees","To expedite the process of resolving only insolvency cases","To close down DigiLocker for private companies"],"answer":"b","explanation":"व्याख्या: IUCN क ग्र न स्टे टस ररपयटव पारों पररक रे ड कलस्ट से कभन्न है । जहााँ रे ड कलस्ट केिल प्रजाकतययों के किलुख्यप्त जयख्यखम का आकलन करत है , िह ों ग्र न स्टे टस ररपयटव प्रजाकतययों क पाररख्यस्थकतक पुनस्थाव पना और सोंरक्षण प्रगकत कय मापत है । अतः कथन 1 गलत है। ररपयटव में घकडयाल कय “गोंभ र रूप से कम (Critically Depleted)” श्रेण में रखा गया है , इसकलए कथन 2 सह है । ितवमान में केिल लगभग 681 ियस्क घकडयाल शेष हैं , कजनमें से लगभग 80% चोंिल नद में पाए जाते हैं । चोंिल अभयारण्य घकडयालयों क एकमात्र व्यिहायव प्रजनन आिाद का घर है , अतः कथन 3 सह है । भारत में घकडयाल कय िन्यज ि सोंरक्षण अकधकनयम, 1972 क अनुसूच -1 में सूच िद् ककया गया है , न कक अनुसूच -2 में, इसकलए कथन 4 गलत है ।"},{"id":114,"question":"Consider the following statements with reference to the first Green Status Report of the Gharial (Gavialis gangeticus) recently released by the IUCN: (1) The IUCN Green Status Report assesses the risk of extinction of species. (2) The report places the Gharial in the “Critically Depleted” category. (3) The Chambal River is home to the only viable breeding population of Gharials. (4) In India, the Gharial is listed in Schedule-2 of the Wildlife Protection Act, 1972. Which of the above statements are correct?","options":["Only 1 and 2","Only 2 and 3","Only 2, 3 and 4","Only 1, 2 and 3"],"answer":"b","explanation":"व्याख्या: ब्लू फ्लैग प्रमाणन एक अोंतराव ष्टर य स्तर का पयाव िरण य सम्मान है , कजसे डे नमाकव ख्यस्थत प्रदान करता है । यह प्रमाणन केिल समुद्र तट क सुोंदरता के आधार पर नह ों कदया जाता, िख्यल्क इसके कलए 33 कठयर मानदों डयों का पालन अकनिायव हयता है । इन मानदों डयों में जल क गुणित्ता, पयाव िरण कशक्षा एिों जागरूकता, पयवटक सुरक्षा, कचरा एिों पयाव िरण प्रिोंधन तथा सािवजकनक सुकिधाएाँ शाकमल हैं । अतः कथन 1 और 3 सह हैं , तथा कथन 2 गलत है ।"},{"id":115,"question":"Recently, the Maharashtra government received the ‘International Blue Flag certification’ for five of its beaches. Consider the following statements regarding this certification: (1) The Blue Flag certification is awarded by the Foundation for Environmental Education (FEE), based in Denmark. (2) This certification is granted solely based on the natural beauty and tourism potential of the beach. (3) This certification requires adherence to criteria such as water quality, environmental management, safety, and public amenities. Which of the statements given above is/are correct?","options":["Only 1 and 2","Only 1 and 3","Only 2 and 3","1, 2 and 3"],"answer":"c","explanation":"व्याख्या: हाल ह में केंद्र सरकार ने प एम ई-डर ाइि ययजना के अोंतगवत दे शभर में लगभग 72,300 सािवजकनक इलेख्यिरक िाहन (EV) चाकजिंग स्टे शनयों क स्थापना हे तु पररचालन कदशाकनदे श जार ककए हैं । इस ययजना का उद्दे श्य भारत में इलेख्यिरक मयकिकलट कय िढािा दे ने के कलए चाकजिंग अिसोंरचना का त व्र किस्तार करना है । ययजना के प्रभाि कायावन्वयन के कलए भारत हे ि इलेख्यिरकल्स कलकमटे ड (BHEL) कय पररययजना कायावन्वयन एजेंस (PIA) के रूप में नाकमत ककया गया है । BHEL क भूकमका में तकन क समन्वय, पररययजना प्रिोंधन और किकभन्न नयडल एजेंकसययों के साथ समन्वय शाकमल है ।"},{"id":116,"question":"Which institution has been designated as the Project Implementing Agency (PIA) for the establishment of public electric vehicle charging stations under the PM e-Drive scheme?","options":["NITI Aayog","National Thermal Power Corporation","Bharat Heavy Electricals Limited","Bureau of Energy Efficiency"],"answer":"d","explanation":"व्याख्या: िन पर पयाविरण लेखा–2025” ररपयटव कय साों ख्यख्यक एिों कायवक्रम कायावन्वयन मोंत्रालय (MoSPI) द्वारा 25–26 कसतोंिर, 2025 कय आययकजत केंद्र य एिों राज्य साों ख्यख्यक सोंगठनयों (CoCSSO) के 29िें सम्मेलन के दौरान जार ककया गया। यह सम्मेलन चोंड गढ में आययकजत हुआ था। ररपयटव सोंयुक्त राष्टर के SEEA ढाों चे के अनुसार तैयार क गई है और इसमें राष्टर य तथा राज्य/केंद्रशाकसत प्रदे श स्तर पर िनयों क पररसोंपकत्त, किस्तार, ख्यस्थकत और पाररख्यस्थकतक सेिाओों का किस्तृत मूल्याोंकन प्रस्तुत ककया गया है ।"},{"id":117,"question":"The “Environmental Accounting on Forests– 2025” report, which was released during the 29th Conference of Central and State Statistical Organisations (CoCSSO) conference, was published at a conference held in which city?","options":["New Delhi","Bhopal","Jaipur","Chandigarh"],"answer":"c","explanation":"व्याख्या: SAIME (मैंग्रयि पाररख्यस्थकतक तोंत्र में सतत जल य कृकष) मॉडल कय पकिम िोंगाल के सुोंदरिन क्षेत्र में NGO प्रकृकत पयाव िरण और िन्यज ि सयसायट (NEWS) द्वारा किककसत ककया गया है , कजसे FAO ने िैकश्वक तकन क मान्यता प्रदान क है । यह एक पाररख्यस्थकतक -आधाररत और जलिायु-अनुकूल मॉडल है , कजसमें जल य कृकष तालाियों में 5%–30% तक मैंग्रयि आिरण िनाए रखा जाता है । इसका उद्दे श्य मैंग्रयि पाररख्यस्थकतक तोंत्र का सोंरक्षण करते हुए मत्स्यपालकयों क आय िढाना है । यह मॉडल भारत क ब्लू इकॉनम , नेचर-िेस्ड सॉल्यूशोंस तथा SDG-13, 14 और 15 के अनुरूप है ।"},{"id":118,"question":"What is the main objective of the SAIME model, which recently received global technical recognition from the United Nations Food and Agriculture Organization (FAO)?","options":["To maximize shrimp production only","To expand aquaculture by removing mangrove ecosystems","To promote sustainable aquaculture-based livelihoods along with mangrove conservation","To encourage industrial fishing in coastal areas"],"answer":"b","explanation":"व्याख्या: IBR रयग भारत में स्थाकनक है और इसका कारण BHV-1 है , जय अल्फाहपीसकिररने उपपररिार के िैररसेलयिायरस ज नस का सदस्य है । यह रयग मुख्य रूप से एरयसयल मागव से फैलता है और प्रजनन तोंत्र कय प्रभाकित करता है । सोंक्रकमत ि यव के माध्यम से भ यह िैलयों से दु धारू पशुओों में फैल सकता है । रक्षा-IBR िैक्स न इस रयग से िचाि और डे यर उत्पादकता सुधारने के कलए किककसत क गई है ।"},{"id":119,"question":"Infectious Bovine Rhinotracheitis (IBR) disease is caused by which virus?","options":["Bovine Rotavirus","Bovine Herpesvirus Type 1 (BHV-1)","Epivax virus","African cattle fever virus"],"answer":"c","explanation":"व्याख्या: भारत–दकक्षण कयररया नौसैकनक कद्वपक्ष य अभ्यास IN–RoKN का उद् घाटन सोंस्करण 13 अिू िर 2025 कय दकक्षण कयररया के िुसान नौसैकनक अड्डे पर प्रारों भ हुआ। यह अभ्यास भारत य नौसेना और कयररया गणराज्य नौसेना के ि च िढत रणन कतक साझेदार कय दशाव ता है । अभ्यास दय चरणयों—हािवर फेज और स फेज—में आययकजत ककया गया। इसमें INS सह्याद्र और ROKS ग्ययोंगनम ने भाग कलया। यह अभ्यास इों डय- पैकसकफक क्षेत्र में समुद्र सहययग, आपस किश्वास और सोंचालनात्मक समन्वय कय मजिूत करने क कदशा में महत्पूणव कदम है ।"},{"id":120,"question":"Where was the inaugural edition of the IndiaSouth Korea naval bilateral exercise IN-RoKN held in October 2025?","options":["Visakhapatnam","Tokyo","Busan Naval Base","Jakarta"],"answer":"a","explanation":"व्याख्या: कदसोंिर 2025 में, यूनेस्कय ने द पािल कय अपन अमूतव साोंस्कृकतक किरासत क सूच में शाकमल ककया है , जय भारत का 16िाों तत् है , और यह भारत के साों स्कृकतक कूटन कत में एक िड उपलख्यब्ध है , जिकक छठ महापिव कय भ इस सूच में शाकमल करने के कलए िहुराष्टर य नामाों कन (UAE, सूर नाम, न दरलैंड्स के साथ) भारत ने पहले ह प्रस्तुत कर कदया है और यह 2026-27 चक्र के कलए एक महत्पूणव नामाों कन है , जय भारत क समृद् और किकिध परों पराओों कय दशाव ता है । इस अिकध में भारत नई कदल्ल में यूनेस्कय क 20ि ों ICH सकमकत क मेजिान करे गा। यह मोंच भारत कय अपन समुदाय-आधाररत किरासत सोंरक्षण न कत, साों स्कृकतक कूटन कत और सतत किकास से जुड पहल कय िैकश्वक स्तर पर प्रस्तुत करने का अिसर दे गा। द िाल का यूनेस्कय में नामाों कन भारत द्वारा ककया गया है , लेककन यह केिल भारत में ह नह ों मनाया जाता है । द िाल नेपाल, िाों ग्लादे श, श्र लोंका, मलेकशया, कसोंगापुर, कफज , गुयाना, कत्रकनदाद और टयिैगय, सूर नाम जैसे दे शयों में भ मनाई जात है । यूनेस्कय ने इसे िैकश्वक साोंस्कृकतक किरासत के रूप में मान्यता द है , न कक केिल भारत य पिव के रूप में। इसकलए कथन 2 गलत है ।"},{"id":121,"question":"Consider the following statements regarding the UNESCO Intangible Cultural Heritage nominations of Chhath Mahaparva and Diwali: (1) The Chhath Mahaparva nomination has been made under the multinational category. (2) The Diwali nomination has been made as a festival celebrated only in India. (3) Chhath Mahaparva is an environment-based festival dedicated to the Sun God and Chhathi Maiya. Which of the above statements is/are correct?","options":["Only 1 and 3","Only 1 and 2","Only 2 and 3","1, 2 and 3"],"answer":"c","explanation":"व्याख्या: भारत के रक्षा मोंत्र ने हाल ह में मयरक्कय में टाटा एडिाों स्ड कसस्टम्स कलकमटे ड (TASL) क रक्षा किकनमाव ण सुकिधा का उद् घाटन ककया, जय ककस भारत य कनज कोंपन क पहल किदे श रक्षा उत्पादन इकाई है । यह सोंयोंत्र मयरक्कय का सिसे िडा रक्षा किकनमाव ण केंद्र भ है । इस सुकिधा में TASL और DRDO द्वारा सोंयुक्त रूप से किककसत WhAP 8x8 पकहयेदार िख्तरिोंद प्लेटफॉमव का उत्पादन ककया जाएगा। यह पहल भारत क आत्मकनभवर भारत, मेक इन इों कडया, और मेक फॉर द िर्ल्व रणन कत कय सुदृढ करत है । अफ् का और यूरयप के प्रिेश द्वार के रूप में मयरक्कय क भौगयकलक ख्यस्थकत भारत-मयरक्कय रक्षा सहययग और कनयाव त क्षमता कय िढात है ।"},{"id":122,"question":"What is the main objective of the defense manufacturing facility established by Tata Advanced Systems Limited (TASL) in Morocco?","options":["Manufacturing of light combat aircraft","Production of anti-submarine weapons","Production of WhAP 8x8 wheeled armored platforms","Manufacturing of drones and unmanned systems"],"answer":"c","explanation":"व्याख्या: अिू िर 2025 में च न ने गॉि रे कगस्तान, गाों सु प्राों त में दु कनया का पहला सौर थमवल ऊजाव सोंयोंत्र शुरू ककया। इसमें दय 200-म टर ऊाँचे टािर हैं और 27,000 दपवण सूयव क रयशन कय केंकद्रत करके 570°C तक गमी सोंग्रकहत करते हैं । इसका डु अल-टािर कडजाइन पारों पररक एकल टािर कडजाइन क तुलना में 25% अकधक कुशल है और दपवणयों क सोंख्या कम करता है , कजससे लागत िचत है । यह सोंयोंत्र सौर फयटयियख्यिक और पिन ऊजाव क अख्यस्थरता कय सोंतुकलत करता है और कनरों तर किजल उत्पादन सुकनकित करता है ।"},{"id":123,"question":"What is the main advantage of the dual-tower design of China’s Gobi Desert solar thermal power project?","options":["It is only for small-scale power generation.","It reduces energy storage capacity.","It increases efficiency by 25% and reduces the need for mirrors.","It only works with solar photovoltaic plants."],"answer":"b","explanation":"व्याख्या: नमस्ते ययजना (NAMASTE) का मुख्य उद्दे श्य स िर और सेकिक टैं क सफाई कय पूर तरह से याों कत्रक िनाकर स्वच्छता कमवचाररययों क सुरक्षा सुकनकित करना है । इसके तहत शहर स्थान य कनकाययों (ULB) में सफाई श्रकमकयों क पहचान क जात है , उन्हें कौशल किकास, सुरक्षा उपकरण, स्वास्थ्य ि मा और कित्त य सहायता द जात है । यह ययजना आिासन और शहर मामलयों के मोंत्रालय तथा सामाकजक न्याय एिों अकधकाररता मोंत्रालय द्वारा सोंयुक्त रूप से लागू क जा रह है । इससे स्वच्छता कमवचाररययों कय सुरकक्षत, सम्मानजनक आज किका कमलत है और असुरकक्षत सफाई प्रथाओों का अोंत हयता है ।"},{"id":124,"question":"Consider the following statements regarding the NAMASTE scheme: (1) The objective of this scheme is to make sewer and septic tank cleaning 100% mechanized. (2) This scheme is being implemented solely by the Ministry of Housing and Urban Affairs. (3) Under this scheme, sanitation workers are provided with training, safety equipment, and health insurance. Which of the statements given above is/are correct?","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"b","explanation":"व्याख्याः आयुष मोंत्रालय ने 10िें राष्टर य आयुिेद कदिस (23 कसतोंिर) के अिसर पर गयिा के अख्यखल भारत य आयुिेद सोंस्थान (AIIA) में भारत का पहला एक कृत ऑन्कयलॉज अनुसोंधान और दे खभाल केंद्र (IORCC) स्थाकपत ककया। यह केंद्र आयुिेद, ययग, पोंचकमव, आहार कचककत्सा, कफकजययथेरेप और मॉडनव ऑन्कयलॉज कय एक कृत करता है । इस पहल का उद्दे श्य राष्टर य स्वास्थ्य न कत के तहत पारों पररक और आधुकनक कचककत्सा प्रणाकलययों कय जयडकर रयकगययों कय िहु-किषयक और समग्र दे खभाल प्रदान करना है । यह आयुिेद के मन, शर र और आत्मा के सोंतुलन के कसद्ाों त पर आधाररत है ।"},{"id":125,"question":"At which institution has India’s first Integrated Oncology Research and Care Centre (IORCC) been established?","options":["National Institute of Cancer","All India Institute of Ayurveda (AIIA), Goa","Central Council for Research in Ayurvedic Sciences (CCRAS), Delhi","All India Institute of Medical Sciences (AIIMS), New Delhi"],"answer":"d","explanation":"व्याख्या: राष्टर य धनिोंतर आयुिेद पुरस्कार 2025 आयुिेद के किकास में उत्कृष्ट ययगदान दे ने िाले व्यख्यक्तययों कय कदया जाता है । इस िषव प्रयफेसर िनिार लाल गौर कय आयुिेद कशक्षा और साकहत्य में उनके शैक्षकणक ययगदान के कलए, िैद्य न लकोंधन मूस ईट कय केरल क पारों पररक आयुिेकदक किरासत कय सोंरकक्षत रखने और प्रचाररत करने के कलए, तथा िैद्य भािना प्रशर कय आयुिेद और ज नयकमक्स के एक करण में उनके िैज्ञाकनक ययगदान के कलए सम्माकनत ककया गया। यह पुरस्कार आयुिेद के त नयों आयामयों—शैक्षकणक, पारों पररक और िैज्ञाकनक—कय सम्माकनत करता है , कजससे आयुिेद क कनरों तरता और किकास का उदाहरण प्रस्तुत हयता है ।"},{"id":126,"question":"Which of the following individuals was honored with the National Dhanvantari Ayurveda Award 2025 for their academic, traditional, and scientific contributions to Ayurveda?","options":["Professor Banwari Lal Gaur","Vaidya Neelakandhan Moos ET","Vaidya Bhavana Prashar","All of the above"],"answer":"b","explanation":"व्याख्या: भारत कय 2025 में अोंतराव ष्टर य सामाकजक सुरक्षा सोंगठन (ISSA) द्वारा उत्कृष्ट उपलख्यब्ध पुरस्कार कदया गया है , क्योंकक दे श ने अनौपचाररक और औपचाररक कमवचाररययों के कलए सामाकजक सुरक्षा के किस्तार में निाचार ककया है । इसमें ई-श्रम पयटव ल जैसे कडकजटल उपकरणयों का उपययग करके 30 करयड से अकधक कमवचाररययों कय जयडा गया है , कजससे उन्हें पेंशन, स्वास्थ्य लाभ और कौशल किकास जैस सुकिधाएों कमल हैं। यह पहल न केिल भारत में िख्यल्क िैकश्वक स्तर पर भ अनौपचाररक श्रकमकयों क सुरक्षा के कलए प्रेरणादायक है । इस प्रयास ने भारत कय किश्व स्तर पर अग्रण िनाया है ।"},{"id":127,"question":"For what reason was India awarded the Outstanding Achievement Award by the International Social Security Association (ISSA) in 2025?","options":["Outstanding contribution to industrial development","Innovation in extending social security to informal and formal workers","Excellence in promoting foreign investment","Outstanding efforts in the education sector"],"answer":"b","explanation":"व्याख्या: किश्व पयाव िरण कदिस 2025 क थ म 'प्लाख्यस्टक प्रदू षण कय हराना' थ , कजसका उद्दे श्य प्लाख्यस्टक के उत्पादन, उपययग और कनपटान के सोंदभव में जागरूकता िढाना तथा प्लाख्यस्टक के उपययग कय कम करना, पुनः उपययग और र सायकल करने जैसे समाधानयों कय िढािा दे ना था। इस िषव क मेज़िान दकक्षण कयररया द्वारा क गई थ । भारत ने इस अिसर पर 'एक पेड मााँ के नाम' अकभयान और 'अरािल ग्र न िॉल प्रयजेि' जैस पहलयों कय आगे िढाया, जय पयाव िरण सोंरक्षण और भूकम क्षरण रयकने के कलए अहम हैं । प्लाख्यस्टक प्रदू षण िैकश्वक और भारत य स्तर पर गोंभ र चुनौत है , कजसके समाधान के कलए न कतगत, तकन क और जन भाग दार आिश्यक है ।"},{"id":128,"question":"What is the theme of World Environment Day 2025?","options":["‘Ecosystem Restoration’","‘Beat Plastic Pollution’","Increasing plastic production","‘Only One Earth’"],"answer":"c","explanation":"व्याख्या: िषव 2025 के इकयनॉकमक फ् डम इों डेक्स में भारत 128िें स्थान पर है , जय कई दे शयों क तुलना में कम आकथवक स्वतोंत्रता कय कदखाता है । यह इों डेक्स कानून के शासन, सरकार के आकार, रे गुलेटर दक्षता और िाजार क खुलापन जैसे मापदों डयों पर 176 अथवव्यिस्थाओों का मूल्याों कन करता है । भारत का 53.0 का स्कयर इसे \"ज्यादातर गैर-स्वतोंत्र\" श्रेण में रखता है , जय राजकयष य स्वास्थ्य, कनिेश क स्वतोंत्रता और कित्त य स्वतोंत्रता जैसे क्षेत्रयों में िाधाओों का सोंकेत दे ता है । यह रैं ककोंग व्यापार के माहौल कय िेहतर िनाने और आकथवक अिसरयों का किस्तार करने के कलए गहरे सोंरचनात्मक सुधारयों क आिश्यकता पर प्रकाश डालत है ।"},{"id":129,"question":"What is India’s rank in the 2025 Index of Economic Freedom?","options":["108","118","128","138"],"answer":"b","explanation":"व्याख्या: 24 कसतोंिर से 2 अिू िर 2025 तक ISSF जूकनयर िर्ल्व कप नई कदल्ल के डॉ. कणी कसोंह शूकटों ग रें ज में आययकजत हुआ था। भारत ने 26 पदकयों (8 स्वणव, 10 रजत, 8 काों स्य) के साथ श षव स्थान हाकसल ककया। यह जूकनयर िर्ल्व कप राइफल, कपस्टल और शॉटगन त नयों स्पधाव ओों के कलए था, कजसमें युिा कनशानेिाज शाकमल हुए थे। भारत ने सिसे ज़्यादा स्वणव पदक (8) ज ते और कुल पदकयों में भ श षव पर रहा, जिकक च न के एथल टयों ने भ अच्छा प्रदशवन ककया लेककन भारत से प छे रहे ।"},{"id":130,"question":"Which of the following statements is correct regarding the 2025 ISSF Junior World Cup?","options":["This event was held in New Delhi, India.","India topped the medal table in this event.","This event was exclusively for pistol shooters.","China won the most gold medals."],"answer":"b","explanation":"व्याख्या: कथन 1 सह है क्योंकक आययजन सोंस्कृकत मोंत्रालय, IBC, GBU और अोंतराव ष्टर य िौद् शयध सोंस्थान के सहययग से ककया गया। कथन 2 गलत है क्योंकक दय किशेष थ म-आधाररत प्रदशवन — “शर र एिों मन पर िुद् धम्म” और “कपपरहिा अिशेष”—आययकजत क गई थ ।ों कथन 3 गलत है क्योंकक अकभधम्म, िौद् कत्रकपटक का तृ त य भाग है और यह दाशवकनक, नैकतक तथा मनयिैज्ञाकनक आयामयों पर केंकद्रत है , न कक केिल अनुष्ठानयों पर। कथन 4 सह है क्योंकक भारत सरकार ने पाल भाषा कय शाि य भाषा का दजाव कदया है ।"},{"id":131,"question":"Which of the following laid the foundation of English education in India? (1) Charter Act, 1813 (2) General Committee of Public Instruction, 1823 (3) Orientalist–Anglicist Controversy Choose the correct answer using the code given below:","options":["1 and 2 only","2 only","1 and 3 only","1, 2 and 3"],"answer":"d","explanation":"व्याख्या: • 1813 का चाटव र एि – पहल िार भारत में कशक्षा के प्रसार हेतु प्रकतिषव ₹1 लाख खचव करने का प्रािधान ककया गया, कजससे आधुकनक/अोंग्रेज कशक्षा क आधारकशला पड । • जनरल कमेट ऑफ पख्यब्लक इों स्टरक्शन (1823) – 1813 के अकधकनयम के तहत कशक्षा व्यिस्था एिों कनकध के प्रिोंधन हे तु गकठत सकमकत, कजसने आगे चलकर अोंग्रेज माध्यम से पकिम कशक्षा का समथवन ककया। • प्राच्यकिद् –आों ग्लकिद् कििाद – कशक्षा के माध्यम एिों पाठ्यक्रम कय लेकर कििाद; प्राच्यकिद् भारत य भाषाओों के पक्षधर थे, जिकक आों ग्लकिद् अोंग्रेज माध्यम से आधुकनक कशक्षा के समथवक थे। इसका अोंत 1835 के मैकाले के स्मरण पत्र तथा लॉडव किकलयम िेंकटक द्वारा उसे स्व कार ककए जाने से हुआ, कजसके िाद अोंग्रेज उच्च कशक्षा का आकधकाररक माध्यम िन गई।"},{"id":132,"question":"Which of the following statements relating to the framing of the Constitution of India are correct? (1) Pandit Nehru’s Objectives Resolution, as adopted by the Constituent Assembly, influenced the framing of the Constitution. (2) The Preamble serves very important objectives. (3) The Constitution has been enacted by the People of India. (4) The Head of the State is directly elected by the people. Choose the correct answer using the code given below: Code:","options":["1, 2 and 3","1, 3 and 4","2, 3 and 4","All four"],"answer":"a","explanation":"व्याख्या: • 13 कदसोंिर 1946 कय प्रस्तुत उद्दे श्य प्रस्ताि 22 जनिर 1947 कय स्व कार ककया गया। यह सोंकिधान क प्रस्तािना का आधार िना। • प्रस्तािना सोंकिधान के स्रयत, राज्य क प्रकृकत तथा न्याय, स्वतोंत्रता, समता और िोंधुत् जैसे आदशों कय व्यक्त करत है । • \"हम भारत के लयग\" से स्पष्ट है कक सोंकिधान क अोंकतम सोंप्रभु शख्यक्त भारत क जनता में कनकहत है । • भारत के राष्टरपकत (राज्याध्यक्ष) का चुनाि अप्रत्यक्ष रूप से कनिाव चक मोंडल द्वारा हयता है , प्रत्यक्ष रूप से नह ।ों"},{"id":133,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R). Assertion (A): The Constitution of India fulfils the needs of the country. Reason (R): It is known as an enacted Constitution. Which one of the following is correct?","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"b","explanation":"व्याख्या: • भारत का सोंकिधान दे श क किकिध आिश्यकताओों (सामाकजक, आकथवक और राजन कतक) कय पूर तरह पूरा करता है । इसमें मौकलक अकधकार, न कत कनदे शक तत् और समय के साथ िदलाि के कलए सोंशयधन क व्यिस्था शाकमल है , जय इसे ज िोंत िनात है । • भारत य सोंकिधान कय एक 'गृह त' या 'उधार कलया हुआ' सोंकिधान कहा जाता है क्योंकक इसके कनमाव ताओों ने दु कनया के लगभग 60 दे शयों के सोंकिधानयों के अच्छे प्रािधानयों और 'भारत शासन अकधकनयम 1935' कय हमार स्थान य पररख्यस्थकतययों के अनुसार अपनाकर इसका कनमाव ण ककया था। • व्याख्या क्यों सह नह ों है ? 'गृह त हयना' (उधार लेना) इसके कनमाव ण क एक प्रकक्रया या किशेषता कय दशाव ता है , न कक आिश्यकताओों कय पूरा करने का मुख्य कारण।"},{"id":134,"question":"The system of Judicial Review exists:","options":["Only in India.","Only in the USA.","In both India and the USA.","Only in the UK."],"answer":"c","explanation":"व्याख्या: न्याकयक पुनकिवलयकन क अिधारणा मूल रूप से सोंयुक्त राज्य अमेररका के सोंकिधान और िहाों के प्रकसद् 'मािवर िनाम मैकडसन' (1803) मामले से किककसत हुई थ । भारत य सोंकिधान कनमाव ताओों ने इस व्यिस्था कय अमेररक सोंकिधान से ह प्रेररत हयकर अपनाया है । भारत में न्यायपाकलका के पास यह शख्यक्त है कक िह सोंसद या राज्य किधानसभाओों द्वारा िनाए गए ककस भ कानून या सरकार के आदे श क जाों च कर सकत है । यकद िह कानून सोंकिधान के मूल ढाों चे या मौकलक अकधकारयों के ख्यखलाफ हयता है , तय न्यायालय उसे असोंिैधाकनक (अिैध) घयकषत कर सकता है ।"},{"id":135,"question":"Match List-I with List-II and choose the correct answer using the code given below: List-I (Features of the Constitution of India) List-II (Borrowed from) A. Fundamental Rights 1. United Kingdom B. Parliamentary System of Government 2. \u0007United States of America C. Emergency Provisions 3. Ireland D. Directive Principles of State Policy 4. Germany 5. Canada Code: A B C D","options":["2","5","2","1"],"answer":"c","explanation":"व्याख्या: सह सुमेलन इस प्रकार है - सूच -I (भारत के सोंकिधान के लक्षण) सूच -II (ककस दे श से गृह त) A. मूल अकधकार 2. सोंयुक्त राज्य अमेररका B. शासन क सोंसद य प्रणाल 1. यू.के. C. आपात उपिोंध 4. जमवन (िाइमर सोंकिधान) D. राज्य न कत के कनदे शक तत् 3. आयरलैंड"},{"id":136,"question":"Which of the following are provided in the Third Schedule of the Constitution of India? (1) Form of oath of office for a Union Minister. (2) Form of oath to be taken by the Chief Justice of India. (3) Form of oath of office for the President of India. (4) Form of oath to be taken by a Member of Parliament. Choose the correct answer using the code given below: Code:","options":["1, 2 and 3","2, 3 and 4","1, 2 and 4","1, 2, 3 and 4"],"answer":"c","explanation":"व्याख्या: भारत य सोंकिधान क त सर अनुसूच किकभन्न सोंिैधाकनक पदाकधकाररययों द्वारा ल जाने िाल शपथ और प्रकतज्ञान के प्रारूपयों से सोंिोंकधत है । इसमें कुल 8 प्रकार के पदयों क शपथ का उल्लेख है : 1. सोंघ के मोंत्र 2. सोंसद के चुनाि के अभ्यथी 3. सोंसद के सदस्य 4. उच्चतम न्यायालय के न्यायाध श 5. भारत के कनयोंत्रक-महालेखापर क्षक 6. राज्य के मोंत्र 7. राज्य किधानमोंडल के चुनाि के अभ्यथी 8. राज्य किधानमोंडल के सदस्य और उच्च न्यायालययों के न्यायाध श भारत के राष्टरपकत के पद क शपथ का प्रारूप सोंकिधान के अनुच्छेद 60 में अलग से कदया गया है ।"},{"id":137,"question":"Match List-I with List-II and choose the correct answer using the code given below: List-I List-II A. Seventh Schedule 1. Languages B. Eighth Schedule 2. \u0007Disqualification on the ground of defection C. Ninth Schedule 3. \u0007Union, State and Concurrent Lists D. Tenth Schedule 4. \u0007Validation of certain Acts Code: A B C D","options":["4","3","2","3"],"answer":"d","explanation":"व्याख्या: सुमेल इस प्रकार है - सूच -I सूच -II A. साति ों अनुसूच 3. सोंघ, राज्य तथा समिती सूकचयाों B. आठि ों अनुसूच 1. भाषाएों C. नौि ों अनुसूच 4. कुछ अकधकनयमयों का किकधमान्यकरण D. दसि ों अनुसूच 2. दल पररितवन के आधार पर कनरहव ता"},{"id":138,"question":"Which of the following is the correct sequence of the words mentioned in the Preamble to the Constitution of India?","options":["Socialist, Secular, Sovereign, Democratic","Sovereign, Socialist, Secular, Democratic","Secular, Socialist, Sovereign, Democratic","Sovereign, Secular, Socialist, Democratic"],"answer":"b","explanation":"व्याख्या: भारत य सोंकिधान क प्रस्तािना में भारत का िणवन इस क्रम में ककया गया है - \"हम, भारत के लयग, भारत कय एक सम्पूणव प्रभुत्-सम्पन्न, समाजिाद , पोंथ-कनरपेक्ष, लयकतोंत्रात्मक, गणराज्य िनाने के कलए...\""},{"id":139,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R): Assertion (A): India is a Sovereign Socialist Secular Democratic Republic. Reason (R): By the 42nd Constitutional Amendment Act, 1976, the words “Sovereign Democratic Republic” were replaced by “Sovereign Socialist Secular Democratic Republic.” Choose the correct answer using the code given below: code:","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"a","explanation":"व्याख्या: • भारत य सोंकिधान क प्रस्तािना के अनुसार, ितवमान में भारत एक \"सोंपूणव प्रभुत्-सोंपन्न, समाजिाद , पोंथकनरपेक्ष (धमवकनरपेक्ष), लयकतोंत्रात्मक गणराज्य\" है । • मूल सोंकिधान (26 जनिर 1950) क प्रस्तािना में भारत कय केिल 'सोंपूणव प्रभुत्-सोंपन्न लयकतोंत्रात्मक गणराज्य' घयकषत ककया गया था। • आपातकाल के दौरान 42िें सोंकिधान सोंशयधन अकधकनयम, 1976 द्वारा प्रस्तािना में त न नए शब्द जयडे गए — 'समाजिाद ', 'पोंथकनरपेक्ष' और 'अखोंडता'। इस सोंशयधन के िाद ह मूल शब्दयों के स्थान पर कथन (A) में कदया गया ितवमान स्वरूप प्रकतस्थाकपत हुआ। इसकलए कारण (R), कथन (A) क किल्कुल सह व्याख्या करता है ।"},{"id":140,"question":"Which of the following pairs is not correctly matched?","options":["Equality before law — Guaranteed to both citizens and non-citizens.","Equality of opportunity in public employment — Guaranteed only to citizens of India.","Formation of a new State — Power of Parliament.","Changing the name of a State — Power of the State Legislature."],"answer":"d","explanation":"व्याख्या: भारत य सोंकिधान के अनुच्छेद 3 के तहत ककस राज्य का नाम िदलने, उसक स माओों में पररितवन करने या नए राज्य के कनमाव ण क शख्यक्त केिल सोंसद के पास है , राज्य किधानमोंडल के पास नह ।ों हालाों कक, इस प्रकक्रया में सोंिोंकधत राज्य किधानमोंडल से राय माों ग जात है , लेककन सोंसद उस राय कय मानने के कलए िाध्य नह ों है ।"},{"id":141,"question":"The Right to Equality is guaranteed under which of the following Articles of the Constitution? (1) Article 13 (2) Article 14 (3) Article 15 (4) Article 16 Choose the correct answer using the code given below: code:","options":["1 and 2","1, 2 and 3","2, 3 and 4","All four"],"answer":"c","explanation":"व्याख्या: भारत य सोंकिधान के भाग-3 (मौकलक अकधकार) के अोंतगवत 'समानता का अकधकार' अनुच्छेद 14 से लेकर अनुच्छेद 18 तक कदया गया है ।"},{"id":142,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R). Assertion (A): The State may treat unequal persons differently in order to create an equal footing in the social, economic and political spheres. Reason (R): The law shall be the same for equals and shall be equally administered among them. Choose the correct answer with reference to the above statements:","options":["A is true, but R is false.","A is false, but R is true.","Both A and R are true, but R is not the correct explanation of A.","Both A and R are true, and R is the correct explanation of A."],"answer":"d","explanation":"व्याख्या: भारत य सोंकिधान का अनुच्छेद 14 केिल 'किकध के समक्ष समानता' ह नह ,ों िख्यल्क 'कानूनयों के समान सोंरक्षण' का भ प्रािधान करता है । इसका आशय यह है कक समान पररख्यस्थकतययों िाले व्यख्यक्तययों के साथ समान व्यिहार ककया जाएगा, जिकक असमान पररख्यस्थकतययों में ख्यस्थत व्यख्यक्तययों के कलए राज्य किशेष प्रािधान या कल्याणकार न कतयााँ िना सकता है । इसे सकारात्मक भेदभाि या युख्यक्तसोंगत िगीकरण का कसद्ाों त कहा जाता है । अतः कारण (R) अनुच्छेद 14 के िास्तकिक अथव कय स्पष्ट करता है कक समानता का तात्पयव समान पररख्यस्थकतययों में समान व्यिहार है । इस आधार पर सामाकजक, आकथवक एिों राजन कतक समानता स्थाकपत करने के कलए असमान व्यख्यक्तययों के साथ कभन्न व्यिहार करना न्याययकचत एिों सोंिैधाकनक माना जाता है। इसकलए कारण (R), कथन (A) का सह स्पष्ट करण है ।"},{"id":143,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R). Assertion (A): Untouchability is the worst form of structural violence. Reason (R): The practice of untouchability is based on religious sanction. Consider the above statements and choose the correct answer using the code given below: Code:","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"a","explanation":"व्याख्या: • अस्पृश्यता सोंरचनात्मक कहों सा का सिसे गोंभ र स्वरूप है , क्योंकक यह सामाकजक व्यिस्था के माध्यम से एक िगव कय जन्म के आधार पर सामाकजक, आकथवक, शैकक्षक एिों राजन कतक अकधकारयों से व्यिख्यस्थत रूप से िोंकचत करत है । • ऐकतहाकसक रूप से अस्पृश्यता कय रूकढिाद धाकमवक मान्यताओों एिों जन्म-आधाररत िणव व्यिस्था से िैधता प्राप्त हुई, कजसके कारण यह समाज क सोंरचना का स्थाय कहस्सा िन गई। • इस धाकमवक स्व कृकत के कारण अस्पृश्यता केिल व्यख्यक्तगत भेदभाि न रहकर सामाकजक व्यिस्था में सोंस्थागत रूप से स्थाकपत हुई, कजससे यह सोंरचनात्मक कहों सा का सिसे गोंभ र स्वरूप िन गई। अतः कारण (R), कथन (A) क सह व्याख्या करता है ।"},{"id":144,"question":"Which of the following rights is derived by reading Article 19(1)","options":["together with Article 21?","Right to travel abroad","Right to asylum","Right to privacy (d) Right to information"],"answer":"a","explanation":"व्याख्या: अनुच्छेद 19(1)(d) नागररकयों कय भारत के राज्यक्षेत्र में स्वतोंत्र रूप से सोंचरण का अकधकार दे ता है , जिकक अनुच्छेद 21 प्रत्येक व्यख्यक्त कय ज िन और व्यख्यक्तगत स्वतोंत्रता का अकधकार प्रदान करता है । इन दयनयों अनुच्छेदयों क सोंयुक्त व्याख्या करते हुए मेनका गाों ध के प्रकसद् कनणवय मेनका गाों ध िनाम भारत सोंघ में उच्चतम न्यायालय ने कहा कक किदे श यात्रा व्यख्यक्तगत स्वतोंत्रता का एक महत्पूणव अोंग है । अतः इसे अनुच्छेद 21 तथा अनुच्छेद 19 के व्यापक सोंदभव में सोंरक्षण प्राप्त है ।"},{"id":145,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R). Assertion (A): The State shall provide free and compulsory education to all children between the ages of 6 and 14 years. Reason (R): In a democratic society, the right to education as a human right is indispensable for interpreting the right to development. Choose the correct answer with reference to the above statements.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","R is true, but A is false."],"answer":"a","explanation":"व्याख्या: • अनुच्छेद 21A के अनुसार राज्य 6 से 14 िषव क आयु के प्रत्येक िच्चे कय कनः शुल्क एिों अकनिायव कशक्षा उपलब्ध कराएगा। यह प्रािधान 86िें सोंकिधान सोंशयधन अकधकनयम, 2002 द्वारा सोंकिधान में जयडा गया और इसे मौकलक अकधकार का दजाव कदया गया। • कशक्षा एक मूलभूत मानिाकधकार है तथा लयकताों कत्रक समाज में जागरूक नागररकयों के कनमाव ण, समान अिसरयों क स्थापना और मानि किकास का आधार है । • कशक्षा कय मौकलक अकधकार िनाने का उद्दे श्य प्रत्येक िच्चे कय कशक्षा उपलब्ध कराकर उसके सिािं ग ण किकास, गररमापूणव ज िन तथा लयकताों कत्रक व्यिस्था में प्रभाि भाग दार सुकनकित करना है । इसकलए कारण (R), कथन (A) का सह स्पष्ट करण करता है ।"},{"id":146,"question":"Which of the following statement regarding the Directive Principles of State Policy is not correct?","options":["It is the duty of the State to apply these principles while making laws.","They are fundamental to the governance of the country.","They impose a legal obligation on the State.","They are only directives for the Legislature and the Executive."],"answer":"c","explanation":"व्याख्या: न कत कनदे शक तत्यों क प्रकृकत गैर-िादययग्य है । इसका मतलि है कक इन्हें लागू कराने के कलए आप अदालत नह ों जा सकते। यह राज्य पर कयई 'कानून िाध्यता' या कानून कतवव्य लागू नह ों करते , िख्यल्क यह केिल एक 'नैकतक और राजन कतक' दाकयत् हैं ।"},{"id":147,"question":"Which one of the following is not a Fundamental Right?","options":["Right against exploitation","Equal pay for equal work","Equality before law","Right to freedom of religion"],"answer":"b","explanation":"व्याख्या: समान काम के कलए समान िेतन मौकलक अकधकार नह ों है , िख्यल्क यह राज्य के न कत कनदे शक तत्यों का कहस्सा है । भारत य सोंकिधान के अनुच्छेद 39(d) के अोंतगवत यह प्रािधान ककया गया है कक राज्य पुरुष और मकहला दयनयों कय समान कायव के कलए समान िेतन सुकनकित करने का प्रयास करे गा। हालाों कक, सिोच्च न्यायालय ने इसे अनुच्छेद 14 और 21 के आलयक में एक सोंिैधाकनक लक्ष्य माना है , लेककन मूल रूप से यह भाग-4 (DPSP) में आता है ।"},{"id":148,"question":"Two statements are given below, one is labelled as Assertion (A) and the other as Reason (R). Assertion (A): The President of India is the head of the Union Executive. Reason (R): The powers of the President are unlimited. In the context of the above, which one of the following is correct?","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"answer":"c","explanation":"व्याख्या: • भारत य सोंकिधान के अनुच्छेद 53 के अनुसार, सोंघ क कायवपाकलका शख्यक्त राष्टरपकत में कनकहत हयत है । िह औपचाररक रूप से सोंघ य कायवपाकलका का मुख्यखया हयता है और सरकार के सभ प्रशासकनक कायव उस के नाम से ककए जाते हैं । • राष्टरपकत क शख्यक्तयाों अस कमत नह ों हैं । उन पर कई स माएों हैं : o अनुच्छेद 74(1) के तहत राष्टरपकत अपन शख्यक्तययों का प्रययग प्रधानमोंत्र के नेतृत् िाल मोंकत्रपररषद क सलाह के अनुसार ह करने के कलए िाध्य है । o सोंकिधान का उल्लोंघन करने पर राष्टरपकत पर अनुच्छेद 61 के तहत महाकभययग चलाकर उन्हें पद से हटाया जा सकता है । o न्यायपाकलका उनके द्वारा कलए गए कनणवययों क न्याकयक सम क्षा भ कर सकत है । अतः स्पष्ट है कक कथन (A) सत्य है लेककन कारण (R) असत्य है ।"},{"id":149,"question":"The members of the Electoral College for the election of the President of India include: (1) Elected members of both Houses of Parliament. (2) Elected members of both Houses of the State Legislatures. (3) Elected members of the Legislative Assemblies of all States. (4) Elected members of the Legislative Assemblies of Delhi and Puducherry. Code:","options":["1, 2 and 3 are correct.","1 and 3 are correct.","1, 2 and 4 are correct.","1, 3 and 4 are correct."],"answer":"d","explanation":"व्याख्या: भारत य सोंकिधान के अनुच्छेद 54 के अनुसार राष्टरपकत का कनिाव चन एक कनिाव चक मोंडल द्वारा ककया जाता है । इस कनिाव चक मोंडल में सोंसद के दयनयों सदनयों (लयकसभा एिों राज्यसभा) के केिल कनिाव कचत सदस्य तथा सभ राज्ययों क किधानसभाओों के कनिाव कचत सदस्य शाकमल हयते हैं । इसके अकतररक्त, 70िें सोंकिधान सोंशयधन अकधकनयम, 1992 द्वारा कदल्ल और पुडुचेर जैसे किधानमोंडल िाले सोंघ राज्य क्षेत्रयों क किधानसभाओों के कनिाव कचत सदस्ययों कय भ कनिाव चक मोंडल में सख्यम्मकलत ककया गया। इसके किपर त, सोंसद के मनयन त सदस्य तथा राज्ययों क किधान पररषदयों के सदस्य राष्टरपकत के चुनाि में भाग नह ों लेते।"},{"id":150,"question":"Which of the following is appointed by the President of India?","options":["Attorney General of India","Comptroller and Auditor General of India","Governor of a State","All of the above Scan this QR code to share"],"answer":"d","explanation":"व्याख्या: • सोंकिधान के अनुच्छेद 76(1) के तहत राष्टरपकत, सिोच्च न्यायालय के न्यायाध श िनने क ययग्यता रखने िाले ककस व्यख्यक्त कय भारत का महान्यायिाद कनयुक्त करता है । िह राष्टरपकत के प्रसादपयिंत अपना पद धारण करता है । • सोंकिधान के अनुच्छेद 148(1) के तहत भारत के कनयोंत्रक एिों महालेखा पर क्षक क कनयुख्यक्त राष्टरपकत द्वारा अपने हस्ताक्षर और मुद्रा सकहत अकधपत्र द्वारा क जात है । • सोंकिधान के अनुच्छेद 155 के अनुसार, ककस राज्य के राज्यपाल क कनयुख्यक्त राष्टरपकत द्वारा क जात है । महान्यायिाद क तरह राज्यपाल भ राष्टरपकत के प्रसादपयिंत ह पद पर िना रहता है ।"}];
let idx=0,selected=null,answers=Array(questions.length).fill(null),locked=false,time=30,interval=null,score=0,correct=0,wrong=0,blank=0;
const $=id=>document.getElementById(id);const letters=['a','b','c','d'];
function render(){locked=false;selected=answers[idx];time=30;$('count').textContent=`Q ${idx+1} / ${questions.length}`;$('timer').textContent='00:30';$('timer').classList.remove('danger');$('progress').style.width=((idx)/questions.length*100)+'%';const q=questions[idx];let h=`<div class="qno">QUESTION ${q.id}</div><div class="q">${esc(q.question)}</div>`;q.options.forEach((o,i)=>{let cls=selected===letters[i]?' selected':'';h+=`<button class="option${cls}" data-a="${letters[i]}"><b>${letters[i].toUpperCase()}.</b> ${esc(o)}</button>`});h+=`<div class="actions"><button class="btn" id="skip">Skip</button><button class="btn primary" id="next">${idx===questions.length-1?'Submit Test':'Next →'}</button></div>`;$('test').innerHTML=h;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(locked)return;selected=b.dataset.a;answers[idx]=selected;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('skip').onclick=()=>{if(!locked){answers[idx]=null;goNext()}};$('next').onclick=()=>goNext();startTimer()}
function startTimer(){clearInterval(interval);interval=setInterval(()=>{time--;$('timer').textContent='00:'+String(time).padStart(2,'0');if(time<=5)$('timer').classList.add('danger');if(time<=0){clearInterval(interval);if(answers[idx]===null)blank++;goNext(true)}},1000)}
function goNext(auto=false){clearInterval(interval);if(idx<questions.length-1){idx++;render()}else{finish()}}
function finish(){clearInterval(interval);score=0;correct=wrong=blank=0;questions.forEach((q,i)=>{if(!answers[i]){blank++;return}if(answers[i]===q.answer){correct++;score+=4}else{wrong++;score-=4/3}});$('progress').style.width='100%';$('test').classList.add('hidden');$('result').classList.remove('hidden');let pct=Math.max(0,(score/(questions.length*4))*100);$('result').innerHTML=`<h1>🏆 Test Completed</h1><div class="score">${score.toFixed(2)}</div><div class="mini">Marks out of ${questions.length*4}</div><div class="stats"><div class="stat"><strong>${correct}</strong>Correct</div><div class="stat"><strong>${wrong}</strong>Wrong</div><div class="stat"><strong>${blank}</strong>Blank</div></div><div class="rank">📊 Rank Dashboard</div><p>Your final rank will be connected to the server leaderboard when the database/backend is added.</p><div class="notice">🎉 LOYAL की तरफ़ से सभी members को Congratulations!</div><button class="btn primary" onclick="review()">Review Answers</button>`}
function review(){idx=0;$('result').classList.add('hidden');$('test').classList.remove('hidden');renderReview()}
function renderReview(){clearInterval(interval);locked=true;const q=questions[idx],sel=answers[idx];$('count').textContent=`Q ${idx+1} / ${questions.length}`;$('progress').style.width=((idx+1)/questions.length*100)+'%';let h=`<div class="qno">QUESTION ${q.id}</div><div class="q">${esc(q.question)}</div>`;q.options.forEach((o,i)=>{let a=letters[i],cls=a===q.answer?' correct':(a===sel?' wrong':'');h+=`<div class="option${cls}"><b>${a.toUpperCase()}.</b> ${esc(o)}</div>`});h+=`<div class="solution"><b>Correct Answer: ${q.answer.toUpperCase()}</b><br><br>${esc(q.explanation||'Explanation not available in supplied source.')}</div><div class="actions"><button class="btn" onclick="prevReview()">← Previous</button><button class="btn primary" onclick="nextReview()">${idx===questions.length-1?'Back to Result':'Next →'}</button></div>`;$('test').innerHTML=h}
function prevReview(){if(idx>0){idx--;renderReview()}}function nextReview(){if(idx<questions.length-1){idx++;renderReview()}else{finish()}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
render();
</script></body></html>
